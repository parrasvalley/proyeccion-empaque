<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Excedentes · Parras Valley</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#060d07; --panel:#0d1a0f; --panel-2:#122316;
  --line:#1d3d22; --line-soft:#16301a;
  --lime:#b8e840; --lime-dim:#8ab52c;
  --good:#5ddc8b; --bad:#ff7a6b;
  --ink:#e6f2e5; --ink-2:#9db3a0; --ink-3:#6a8270;
  --radius:10px;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --disp:"Archivo","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#motor{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px}
.shell{max-width:1080px;margin:0 auto;padding:0 0 64px}
header{position:sticky;top:0;z-index:30;background:rgba(6,13,7,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 12px 12px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:38px;height:38px;border-radius:9px;flex-shrink:0;background:var(--lime);
  color:#0a1405;display:grid;place-items:center;font-family:var(--disp);
  font-weight:800;font-size:17px;letter-spacing:-.5px}
h1{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.4px;margin:0;line-height:1.1}
.sub{font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.wk{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--lime);
  border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;white-space:nowrap}
main{padding:14px 12px}
.deck{display:flex;flex-direction:column;gap:13px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:8px}
.flabel{font-family:var(--disp);font-size:15px;color:var(--lime);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{font-family:var(--sans);font-weight:500;font-size:13.5px;padding:9px 15px;
  border-radius:999px;cursor:pointer;background:var(--panel);color:var(--ink-2);
  border:1.5px solid var(--line);transition:background .12s,color .12s,border-color .12s}
.pills button:hover{border-color:var(--lime-dim);color:var(--ink)}
.pills button[aria-pressed="true"]{background:var(--lime);color:#0a1405;border-color:var(--lime);font-weight:600}
.pills button.gone{opacity:.42;text-decoration:line-through}
.pills button.gone[aria-pressed="true"]{opacity:1;text-decoration:line-through}
button:focus-visible{outline:2.5px solid var(--lime);outline-offset:2px}
.blockhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 9px}
.blockhead h2{font-family:var(--disp);font-weight:700;font-size:17px;margin:0}
.blockhead span{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--line-soft);border-left:3px solid var(--ink-3);
  border-radius:0 var(--radius) var(--radius) 0;padding:11px 13px;
  font-size:12.5px;line-height:1.55;color:var(--ink-2);margin-bottom:14px}
.tablewrap{border:1px solid var(--line);background:var(--panel);
  margin-left:-12px;margin-right:-12px;border-left:none;border-right:none;overflow:hidden}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:340px}
thead th{background:var(--panel-2);color:var(--ink-3);font-size:9.5px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;text-align:right;padding:9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l{text-align:left}
tbody td{padding:9px;text-align:right;border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.l{text-align:left;font-family:var(--sans);font-size:14px;
  white-space:normal;line-height:1.25;padding-left:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr.zebra td{background:rgba(255,255,255,.017)}
.name{font-weight:600;color:var(--ink);display:block}
.meta{font-size:10px;color:var(--ink-3);font-family:var(--mono);display:block;margin-top:1px}
td.total{font-weight:600;font-size:16px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-3)}
.ido{opacity:.4}
tr.stripe td:first-child{box-shadow:inset 3px 0 0 var(--lime)}
tr.short td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.short td{background:rgba(255,122,107,.07)}
tr.past td{color:var(--ink-3);background:rgba(255,255,255,.015)}
tr.past td.l .name{text-decoration:line-through;color:var(--ink-3);font-weight:500}
tr.today td{background:rgba(184,232,64,.07)}
tr.divider td{background:rgba(255,122,107,.13);color:var(--bad);text-align:left;
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;padding:8px 12px}
#puerta{position:fixed;inset:0;z-index:100;background:var(--ground);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#puerta .cand{width:62px;height:62px;border-radius:16px;background:var(--lime);color:#0a1405;
  display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:26px}
#puerta h2{font-family:var(--disp);font-size:22px;font-weight:800;margin:0;color:var(--ink)}
#puerta p{margin:0;font-size:13px;color:var(--ink-3)}
#clave{font-family:var(--mono);font-size:22px;letter-spacing:.4em;text-align:center;
  width:min(240px,80vw);padding:14px;border-radius:12px;background:var(--panel);
  color:var(--ink);border:1.5px solid var(--line);outline:none}
#clave:focus{border-color:var(--lime)}
#entrar{font-family:var(--disp);font-weight:700;font-size:15px;padding:13px 34px;
  border-radius:999px;background:var(--lime);color:#0a1405;border:none;cursor:pointer}
#malo{color:var(--bad);font-size:13px;min-height:18px}
.cargando{text-align:center;padding:3rem 1rem;color:var(--ink-2);font-size:14px}
.cargando b{display:block;font-family:var(--disp);font-size:19px;color:var(--lime);margin-bottom:8px}
.recargar{margin-top:16px;padding:10px 20px;border-radius:999px;background:var(--panel);
  color:var(--ink-2);border:1.5px solid var(--line);cursor:pointer;font-family:var(--sans);font-size:13px}
@media(min-width:700px){
  main{padding:26px 24px}
  .tablewrap{margin-left:0;margin-right:0;border:1px solid var(--line);border-radius:var(--radius)}
  h1{font-size:29px} .flabel{font-size:16px}
  tbody td{padding:13px 14px} thead th{padding:12px 14px}
}
</style>
</head>
<body>
<div id="puerta">
  <div class="cand">PV</div>
  <h2>Excedentes</h2>
  <p>Escribe la clave para entrar</p>
  <input id="clave" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
  <div id="malo"></div>
  <button id="entrar" type="button">Entrar</button>
</div>
<iframe id="motor" src="index.html" title="motor"></iframe>
<div class="shell">
  <header>
    <div class="hrow">
      <div class="mark">PV</div>
      <div><h1>Excedentes</h1><div class="sub" id="sello">Parras Valley · empaque</div></div>
      <div class="wk" id="wk">—</div>
    </div>
  </header>
  <main>
    <div class="deck" id="deck" style="display:none">
      <div class="field"><div class="flabel">Día</div><div class="pills" id="p1"></div></div>
      <div class="field"><div class="flabel">Cultivo</div><div class="pills" id="p2"></div></div>
    </div>
    <div id="out"><div class="cargando"><b>Leyendo la aplicación…</b>
      Trayendo campo, pedidos e inventario.</div></div>
  </main>
</div>

<script>
var DIAS = ["Vie","Sab","Dom","Lun","Mar","Mie","Jue"];
var MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var TALLAS = {L:1,XL:1,JUMBO:1,SMALL:1,MED:1,LARGE:1};
var PRODS = ["Persa","Slicer","Europeo","Minibel","Morron"];
var ORDEN = {Persa:0,Slicer:1,Europeo:2,Minibel:3,Morron:4};
var ORDCAL = {Primera:0,"1a Nacional":1,Segunda:1,Tercera:2};
var nf = new Intl.NumberFormat("es-MX");
var DATOS = null, diaSel = 0, culSel = "Todos";

function firma(v){ var n = Math.round(v); return (n > 0 ? "+" : "") + nf.format(n); }
function tono(v){ return v > 0 ? "up" : v < 0 ? "down" : "flat"; }
function celda(v, extra){
  if (v === null || v === undefined) return '<td class="flat">—</td>';
  return '<td class="' + (extra || "") + " " + tono(v) + '">' + (v === 0 ? "0" : firma(v)) + "</td>";
}
function cifra(txt){
  if (!txt) return [null, null];
  var t = String(txt).trim();
  if (t === "-" || t === "—") return [null, null];
  var m = t.match(/^(-?[\d,]+)/);
  if (!m) return [null, null];
  var caja = t.match(/cj\s+([^(]+)/);
  return [parseInt(m[1].replace(/,/g, ""), 10), caja ? caja[1].trim().toLowerCase() : null];
}

function leerDia(W, dia, tipo){
  var S = W.ST;
  S.tab = "balance"; S.modSem = false; S.subBal = ""; S.di = dia;
  S.fProd = "todos"; S.fTipo = tipo; S.fCal = "todos"; S.fColor = "todos";
  W.renderTab();
  var t = W.document.querySelector("#content table");
  if (!t) return [];
  return [].map.call(t.querySelectorAll("tbody tr"), function(tr){
    return [].map.call(tr.querySelectorAll("td"), function(td){
      return td.innerText.trim().replace(/\s+/g, " ");
    });
  });
}
function leerSem(W, prod, tipo, cal){
  var S = W.ST;
  S.tab = "balance"; S.modSem = true; S.subBal = "";
  S.fProd = prod; S.fTipo = tipo; S.fCal = cal; S.fColor = "todos";
  W.renderTab();
  var t = W.document.querySelector("#content table");
  if (!t) return null;
  var uni = "";
  [].forEach.call(W.document.querySelectorAll("#content .body > div"), function(d){
    var x = d.textContent.trim();
    if (!uni && x.indexOf("TODO EN CAJAS") === 0) uni = x;
  });
  return {u: uni, f: [].map.call(t.querySelectorAll("tbody tr"), function(tr){
    return [].map.call(tr.querySelectorAll("td"), function(td){ return td.innerText.trim(); });
  })};
}

function normCal(c){
  if (TALLAS[c.toUpperCase()]) return "Primera";
  if (c === "Choice") return "Tercera";
  return c;
}

function extraer(W){
  // 1. Ver dia: sirve para saber que calidades existe de verdad en cada cultivo
  var validas = {};
  for (var d = 0; d < 7; d++){
    ["org","conv"].forEach(function(tipo){
      var prod = null;
      leerDia(W, d, tipo).forEach(function(f){
        if (f.length < 7) return;
        if (f[0]) prod = f[0].replace(/\s+(org|cnv|org\+cnv)$/, "").trim();
        var cal = (f[1] || "").trim();
        if (!prod || !cal) return;
        cal = normCal(cal);
        if (cifra(f[6])[0] === null) return;
        validas[(prod.indexOf("Morron") === 0 ? "Morron" : prod) + "|" + cal] = 1;
      });
    });
  }
  // 2. Ver semana: la columna Acumulado, que arrastra el piso una sola vez
  var CAL = [["1","Primera"],["2","Segunda"],["3","Tercera"]];
  var sem = {};
  PRODS.forEach(function(prod){
    ["org","conv"].forEach(function(tipo){
      CAL.forEach(function(par){
        var cid = par[0], clbl = par[1];
        if (prod === "Slicer" && cid === "2") clbl = "1a Nacional";
        if (!validas[prod + "|" + clbl]) return;
        var r = leerSem(W, prod, tipo, cid);
        if (!r) return;
        var caja = r.u.replace("TODO EN CAJAS DE ", "").trim().toLowerCase();
        var acum = [null,null,null,null,null,null,null], vivo = false;
        r.f.forEach(function(f){
          if (f.length < 5) return;
          var i = DIAS.indexOf(f[0]);
          if (i < 0) return;
          var v = cifra(f[4])[0], p = cifra(f[1])[0], dd = cifra(f[2])[0];
          if (v !== null) acum[i] = v;
          if (p || dd || v) vivo = true;
        });
        if (!vivo) return;
        var k = prod + "|" + clbl;
        if (!sem[k]) sem[k] = {p: prod, c: clbl, k: caja, org: null, conv: null};
        if (!sem[k].k) sem[k].k = caja;
        sem[k][tipo] = acum;
      });
    });
  });
  // 3. La regla: el organico tapa al convencional, nunca al reves
  var g = [];
  Object.keys(sem).forEach(function(k){
    var e = sem[k], filas = [];
    for (var d = 0; d < 7; d++){
      var o = e.org ? e.org[d] : null, v = e.conv ? e.conv[d] : null;
      var tr = 0, no = o, nv = v, exc, fal, caso;
      if (o !== null && v !== null && v < 0 && o > 0){
        tr = Math.min(o, -v); no = o - tr; nv = v + tr;
      }
      if (no !== null && nv !== null){
        if (no >= 0 && nv >= 0){ exc = no + nv; fal = 0; caso = 0; }
        else if (no >= 0 && nv < 0){ exc = 0; fal = no + nv; caso = 1; }
        else if (nv >= 0 && no < 0){ exc = nv; fal = no; caso = 2; }
        else { exc = 0; fal = no + nv; caso = 3; }
      } else if (no === null && nv === null){ exc = null; fal = null; caso = 4; }
      else {
        var s = (no === null ? 0 : no) + (nv === null ? 0 : nv);
        exc = Math.max(s, 0); fal = Math.min(s, 0); caso = 4;
      }
      filas.push([o, v, tr, exc, fal, caso]);
    }
    g.push({p: e.p === "Morron" ? "Morrón" : e.p, raw: e.p, c: e.c, k: e.k, f: filas});
  });
  function ordCal(c){ return ORDCAL[c] === undefined ? 3 : ORDCAL[c]; }
  g.sort(function(a, b){
    var d = ORDEN[a.raw] - ORDEN[b.raw];
    return d !== 0 ? d : ordCal(a.c) - ordCal(b.c);
  });
  return g;
}

function pastilla(host, items, actual, alSoltar){
  host.innerHTML = "";
  items.forEach(function(it){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = it.l;
    b.setAttribute("aria-pressed", it.v === actual ? "true" : "false");
    if (it.ido) b.className = "gone";
    b.addEventListener("click", function(){ alSoltar(it.v); pinta(); });
    host.appendChild(b);
  });
}

function tablaSemana(vivos){
  if (culSel !== "Todos"){
    return vivos.map(function(g){
      var filas = g.f.map(function(f, i){
        var tot = (f[4] && f[4] < 0 && !f[3]) ? f[4] : f[3];
        var cls = i < DATOS.hoy ? "past" : i === DATOS.hoy ? "today" : "";
        return '<tr' + (cls ? ' class="' + cls + '"' : "") + '><td class="l">'
          + '<span class="name">' + DATOS.dias[i] + "</span></td>"
          + celda(f[0]) + celda(f[1]) + celda(tot, "total") + "</tr>";
      }).join("");
      return '<div class="blockhead"><h2>' + g.c + '</h2><span>' + g.k + "</span></div>"
        + '<div class="tablewrap"><div class="scroller"><table><colgroup>'
        + '<col style="width:34%"><col style="width:22%"><col style="width:22%">'
        + '<col style="width:22%"></colgroup><thead><tr><th class="l">Día</th>'
        + "<th>Org</th><th>Cnv</th><th>Total</th></tr></thead><tbody>"
        + filas + "</tbody></table></div></div>";
    }).join("");
  }
  var cab = DATOS.dias.map(function(l, i){
    return "<th" + (i < DATOS.hoy ? ' class="ido"' : "") + ">" + l.split(" ")[0] + "</th>";
  }).join("");
  var cuerpo = vivos.map(function(g, n){
    var celdas = g.f.map(function(f, i){
      var tot = (f[4] && f[4] < 0 && !f[3]) ? f[4] : f[3];
      return '<td class="' + (i < DATOS.hoy ? "ido " : "") + tono(tot || 0) + '">'
        + (tot ? firma(tot) : "—") + "</td>";
    }).join("");
    return '<tr class="' + (n % 2 ? "zebra" : "") + '"><td class="l">'
      + '<span class="name">' + g.p + '</span><span class="meta">'
      + g.c.toLowerCase() + " · " + g.k + "</span></td>" + celdas + "</tr>";
  }).join("");
  return '<div class="tablewrap"><div class="scroller"><table style="min-width:660px">'
    + '<thead><tr><th class="l">Cultivo</th>' + cab + "</tr></thead><tbody>"
    + cuerpo + "</tbody></table></div></div>"
    + '<div class="note"><div>Acumulado: arrastra el piso y le va sumando el corte de '
    + "cada día y restando los pedidos. Desliza la tabla de lado.</div></div>";
}

function pinta(){
  pastilla(document.getElementById("p1"),
    [{l:"Semana", v:"sem"}].concat(DATOS.dias.map(function(l, i){
      return {l: l, v: i, ido: i < DATOS.hoy};
    })), diaSel, function(v){ diaSel = v; });
  pastilla(document.getElementById("p2"),
    DATOS.cultivos.map(function(c){ return {l: c, v: c}; }), culSel, function(v){ culSel = v; });

  var vivos = DATOS.g.filter(function(g){ return culSel === "Todos" || g.p === culSel; });
  var out = document.getElementById("out");
  if (diaSel === "sem"){ out.innerHTML = tablaSemana(vivos); return; }

  var n = 0;
  function fila(g, esFalta){
    var f = g.f[diaSel];
    var cls = (esFalta ? "short" : "stripe") + (n++ % 2 ? " zebra" : "");
    return '<tr class="' + cls + '"><td class="l"><span class="name">'
      + (culSel === "Todos" ? g.p : g.c) + '</span><span class="meta">'
      + (culSel === "Todos" ? g.c.toLowerCase() + " · " + g.k : g.k) + "</span></td>"
      + celda(f[0]) + celda(f[1]) + celda(esFalta ? f[4] : f[3], "total") + "</tr>";
  }
  var sobra = vivos.filter(function(g){ return g.f[diaSel][3] > 0; });
  var falta = vivos.filter(function(g){ return g.f[diaSel][4] < 0; });
  var cuerpo = sobra.map(function(g){ return fila(g, false); }).join("");
  if (falta.length){
    n = 0;
    cuerpo += '<tr class="divider"><td colspan="4">Faltantes</td></tr>'
      + falta.map(function(g){ return fila(g, true); }).join("");
  }
  if (!cuerpo){ out.innerHTML = '<div class="note"><div>Sin movimiento aquí.</div></div>'; return; }
  var aviso = diaSel < DATOS.hoy
    ? '<div class="note"><div>Este día ya pasó. Se muestra de referencia.</div></div>' : "";
  out.innerHTML = aviso + '<div class="tablewrap"><div class="scroller"><table><colgroup>'
    + '<col style="width:34%"><col style="width:22%"><col style="width:22%">'
    + '<col style="width:22%"></colgroup><thead><tr><th class="l">'
    + (culSel === "Todos" ? "Cultivo" : "Calidad") + "</th>"
    + "<th>Org</th><th>Cnv</th><th>Total</th></tr></thead><tbody>"
    + cuerpo + "</tbody></table></div></div>";
}

function listo(W){
  var g = extraer(W);
  var hoy = W.getDiHoy();
  var partes = String(W.ST.sI).split("-");
  var vie = new Date(+partes[0], +partes[1] - 1, +partes[2]);
  var dias = [], jue = null;
  for (var i = 0; i < 7; i++){
    var d = new Date(vie); d.setDate(vie.getDate() + i);
    dias.push(DIAS[i] + " " + d.getDate());
    if (i === 6) jue = d;
  }
  var cultivos = ["Todos"];
  g.forEach(function(x){ if (cultivos.indexOf(x.p) < 0) cultivos.push(x.p); });
  DATOS = {g: g, dias: dias, hoy: hoy, cultivos: cultivos};
  diaSel = hoy;
  var ahora = new Date();
  document.getElementById("wk").textContent = vie.getDate() + " — " + jue.getDate()
    + " " + MES[jue.getMonth()];
  document.getElementById("sello").textContent = "al " + dias[hoy] + ", "
    + String(ahora.getHours()).padStart(2, "0") + ":" + String(ahora.getMinutes()).padStart(2, "0");
  document.getElementById("deck").style.display = "flex";
  pinta();
}

function esperar(){
  var W = document.getElementById("motor").contentWindow;
  var intentos = 0;
  var reloj = setInterval(function(){
    intentos++;
    try{
      if (window.__PRUEBA && W.ST && W.aplicaCampo){
        clearInterval(reloj);
        W.ST.sI = window.__PRUEBA.sem;
        W.ST.sem.fR = window.__PRUEBA.fr;
        W.aplicaCampo(window.__PRUEBA.campo);
        W.procesarPed(window.__PRUEBA.ped);
        W.getDiHoy = function(){ return window.__PRUEBA.hoy; };
        listo(W);
        return;
      }
      var S = W.ST;
      var hayCampo = S && S.sem && S.sem.campo && Object.keys(S.sem.campo).length > 0;
      var hayFR = S && S.sem && S.sem.fR && Object.keys(S.sem.fR).length > 0;
      if (hayCampo && hayFR){
        clearInterval(reloj);
        setTimeout(function(){ listo(W); }, 600);
        return;
      }
    }catch(e){}
    if (intentos > 60){
      clearInterval(reloj);
      document.getElementById("out").innerHTML =
        '<div class="cargando"><b>No se pudo leer la aplicación</b>'
        + "Revisa tu conexión y vuelve a intentar."
        + '<br><button class="recargar" onclick="location.reload()">Reintentar</button></div>';
    }
  }, 500);
}
var arrancado = false;
function arranca(){ if (arrancado) return; arrancado = true; esperar(); }

// La clave va revuelta para que no salte a simple vista en el codigo.
// Aun asi, esto no es seguridad de verdad: frena al curioso, no al que sabe.
var LLAVE = "MTk4Ng==";
function correcta(v){ return btoa(String(v).trim()) === LLAVE; }

function abrir(){
  document.getElementById("puerta").style.display = "none";
  var f = document.getElementById("motor");
  arranca();
  if (f.contentWindow && f.contentWindow.document.readyState === "complete") arranca();
}
function intentar(){
  var v = document.getElementById("clave").value;
  if (correcta(v)){
    try{ localStorage.setItem("pv_ok", "1"); }catch(e){}
    abrir();
  } else {
    document.getElementById("malo").textContent = "Clave incorrecta";
    document.getElementById("clave").value = "";
    document.getElementById("clave").focus();
  }
}
document.getElementById("entrar").addEventListener("click", intentar);
document.getElementById("clave").addEventListener("keydown", function(e){
  if (e.key === "Enter") intentar();
});
document.getElementById("clave").addEventListener("input", function(){
  document.getElementById("malo").textContent = "";
});
try{
  if (localStorage.getItem("pv_ok") === "1") abrir();
  else document.getElementById("clave").focus();
}catch(e){ document.getElementById("clave").focus(); }
</script>
