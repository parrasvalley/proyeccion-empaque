<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Limpiar mallas</title>
<style>
body{margin:0;padding:22px 16px;background:#050f05;color:#d1d5db;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
h1{font-size:16px;color:#f87171;letter-spacing:1px;margin:0 0 4px;text-align:center}
.s{font-size:12px;color:#6b7280;margin-bottom:14px;text-align:center;line-height:1.6}
button{width:100%;padding:22px;border:0;border-radius:14px;background:#dc2626;color:#fff;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:1px}
button:active{background:#b91c1c}
button:disabled{background:#374151}
#log{margin-top:14px;font-size:11px;font-family:monospace;line-height:1.7;word-break:break-all}
.ok{color:#4ade80}.err{color:#f87171}.inf{color:#9ca3af}
</style></head><body>
<h1>BORRAR MALLAS DE EUROPEO</h1>
<div class="s">Quita "Europeo M2", "Europeo M7" y "Europeo M6B"<br>de todas las semanas y todos los dias.<br>No toca ningun otro producto.</div>
<button id="b">BUSCAR Y BORRAR</button>
<div id="log"></div>
<script>
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var RAMA="/campo-proyeccion-v1";
var BORRAR=["Europeo M2","Europeo M7","Europeo M6B"];
var L=document.getElementById("log");
function p(t,c){var d=document.createElement("div");d.className=c||"inf";d.textContent=t;L.appendChild(d);}
document.getElementById("b").onclick=function(){
  var b=this;b.disabled=true;b.textContent="Buscando...";L.innerHTML="";
  fetch(FB+RAMA+".json?t="+Date.now()).then(function(r){return r.json();}).then(function(data){
    if(!data){p("No se encontro nada en campo-proyeccion-v1","err");b.disabled=false;b.textContent="BUSCAR Y BORRAR";return;}
    var claves=Object.keys(data);
    p("Revisando "+claves.length+" registros...");
    var pend=[],hallado=0;
    claves.forEach(function(k){
      var d=data[k];if(!d)return;
      BORRAR.forEach(function(nom){
        if(d[nom]!==undefined){
          hallado++;
          var o=d[nom]||{};
          var det=[];
          ["org","conv"].forEach(function(t){
            var v=o[t]&&o[t].rejas;
            if(v!==undefined&&v!=="")det.push(t+"="+v);
          });
          p("  "+k+"  ->  "+nom+(det.length?"  ("+det.join(", ")+")":"  (vacio)"));
          pend.push({k:k,nom:nom});
        }
      });
    });
    if(!hallado){p("No quedan mallas guardadas. Todo limpio.","ok");b.disabled=false;b.textContent="BUSCAR Y BORRAR";return;}
    p("");p("Borrando "+pend.length+" registros...");
    b.textContent="Borrando...";
    var listos=0,fallos=0;
    function sig(i){
      if(i>=pend.length){
        p("");
        p("LISTO. Borrados: "+listos+(fallos?"  |  fallaron: "+fallos:""),fallos?"err":"ok");
        p("Ahora jala de campo otra vez en proyeccion de empaque.","ok");
        b.disabled=false;b.textContent="VOLVER A REVISAR";
        return;
      }
      var x=pend[i];
      fetch(FB+RAMA+"/"+encodeURIComponent(x.k)+"/"+encodeURIComponent(x.nom)+".json",{method:"DELETE"})
        .then(function(r){if(r.ok)listos++;else fallos++;sig(i+1);})
        .catch(function(){fallos++;sig(i+1);});
    }
    sig(0);
  }).catch(function(e){
    p("Error: "+e.message,"err");
    p("Esta pagina debe abrirse desde parrasvalley.github.io, no como archivo suelto.","err");
    b.disabled=false;b.textContent="BUSCAR Y BORRAR";
  });
};
</script>
</body></html>
