<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Proyeccion Empaque - Parras Valley</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#070d07;color:#e8f5e9;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:15px}
    .hdr{background:linear-gradient(180deg,#0a1a0a,#0d1f0d);border-bottom:2px solid #1e6b1e;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.7)}
    .hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .logo{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:900;font-size:14px;padding:6px 10px;border-radius:8px;letter-spacing:1px;box-shadow:0 2px 8px rgba(34,197,94,.4)}
    .ttl{font-weight:900;font-size:18px;color:#bbf7d0;letter-spacing:.5px}
    .sub{font-size:10px;color:#4ade80;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    .tab{padding:8px 16px;border-radius:6px;border:1.5px solid #1e4d1e;background:rgba(34,197,94,.04);color:#4b5563;font-size:13px;font-weight:700;cursor:pointer}
    .tab.on{background:linear-gradient(135deg,rgba(34,197,94,.2),rgba(22,163,74,.15));border-color:#22c55e;color:#86efac;box-shadow:0 0 10px rgba(34,197,94,.2)}
    .body{padding:14px}
    .sec{font-size:11px;font-weight:900;color:#4ade80;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
    .card{background:linear-gradient(180deg,#0f1f0f,#0a150a);border:1.5px solid #1e4d1e;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
    .btn{padding:7px 14px;border-radius:7px;border:1.5px solid #1e4d1e;background:rgba(34,197,94,.06);color:#86efac;font-size:12px;cursor:pointer;font-weight:700}
    .btn:active{opacity:.7}
    .btn.grn{background:rgba(34,197,94,.18);border-color:#22c55e;color:#22c55e}
    .frow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
    .fpbtn{padding:5px 12px;border-radius:6px;border:1.5px solid #1e4d1e;background:transparent;color:#4b5563;font-size:11px;cursor:pointer;font-weight:700}
    .fpbtn.on{background:rgba(34,197,94,.15);border-color:#22c55e;color:#22c55e}
    .badge-org{background:rgba(74,222,128,.18);color:#4ade80;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:800;border:1px solid rgba(74,222,128,.3)}
    .badge-conv{background:rgba(251,191,36,.18);color:#fbbf24;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:800;border:1px solid rgba(251,191,36,.3)}
    input[type=number],input[type=text]{background:#0a150a;border:1.5px solid #1e4d1e;border-radius:5px;color:#bbf7d0;padding:5px 8px;font-size:12px;width:100%;font-weight:600}
    input[type=number]:focus,input[type=text]:focus{outline:none;border-color:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.3)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{padding:8px;background:rgba(34,197,94,.1);color:#22c55e;font-weight:900;text-align:right;border-bottom:2px solid rgba(34,197,94,.3);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    th:first-child,th:nth-child(2),th:nth-child(3){text-align:left}
    td{padding:7px 8px;border-bottom:1px solid #0f2a0f;vertical-align:middle}
    tr:hover td{background:rgba(34,197,94,.04)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var uS=React.useState,uE=React.useEffect,uM=React.useMemo,uR=React.useRef;

// ── Constantes ──────────────────────────────────────────────────────────────
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var FB_C=FB+"/campo-proyeccion-v1.json";
var FB_PED=FB+"/campo-proy-semanas-v1";
var FB_FR=FB+"/emp-factores-rancho-v1.json";
var FB_INR=FB+"/emp-inventario-rancho-v1.json";
var FB_INV=FB+"/produccion-v1.json";
var LS="pvt_proyeccion_v3";

var RANCHOS=["pvt","crp","f4h"];
var RANCHO_L={pvt:"PVT",crp:"Cordillera",f4h:"Forrajera"};
var RPRODS={pvt:["Persa","Slicer"],crp:["Persa","Slicer","Europeo","Morron","Minibel"],f4h:["Persa","Morron","Minibel"]};
var DIAS=["Vie","Sáb","Dom","Lun","Mar","Mié","Jue"];
var TIPOS=["org","conv"];
var GRN="#86c87a";
var CM=[{id:"rojo",l:"Rojo",c:"#ef4444"},{id:"naranja",l:"Naranja",c:"#f97316"},{id:"amarillo",l:"Amarillo",c:"#eab308"},{id:"verde",l:"Verde",c:"#22c55e"}];

var KG_CAJA={"20 LBS":9.25,"20 LBS XF":9.25,"20 LBS MDL":9.25,"20 LBS MDS":9.25,"20LBS":9.25,
  "12X1 LB":5.70,"12X1 LB RPC":5.70,"12X1 LB CV":5.70,"12X1 LB ORG":5.70,"12X1 LBS STO":5.70,"12X1 LBS":5.70,"12X1LB":5.70,
  "8X2 LBS":7.60,"8X2LBS":7.60,"17 LBS":7.94,"12X8 OZ":2.88,"12X8OZ":2.88,
  "50 LBS":23.13,"25 LBS":11.57,"25LB OG GREEN":11.57,"25LB OG RED":11.57,"25LBS":11.57,
  "11LB":4.99,"11 LB":4.99,"18CT":5.44};
var PZS_CAJA={"12CT":12,"12CT CV":12,"24S RPC":24,"24 S RPC":24,"36CT":36,"36CT OG":36,"BUSHEL":12,"CONTENEDOR":0,"175 PZS":175,"175PZS":175};

var DIA_IDX={Vie:0,"Sáb":1,Sab:1,Dom:2,Lun:3,Mar:4,"Mié":5,Mie:5,Jue:6};

// ── Helpers ──────────────────────────────────────────────────────────────────
function nv(x){return(typeof x==="number"&&!isNaN(x))?x:(parseFloat(x)||0);}
function r2(x){return Math.round(x*100)/100;}
function pc(a,b){return b>0?r2(a/b*100):0;}

function fechaLocalISO(){
  var d=new Date();
  var m=d.getMonth()+1;var dd=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0"+m:m)+"-"+(dd<10?"0"+dd:dd);
}

function getSem(){
  var d=new Date();
  var dow=d.getDay();
  var offset={5:0,6:1,0:2,1:3,2:4,3:5,4:6}[dow]||0;
  var fri=new Date(d);fri.setDate(d.getDate()-offset);
  var m=fri.getMonth()+1;var dd=fri.getDate();
  return fri.getFullYear()+"-"+(m<10?"0"+m:m)+"-"+(dd<10?"0"+dd:dd);
}

function getDiHoy(){
  var dow=new Date().getDay();
  return {5:0,6:1,0:2,1:3,2:4,3:5,4:6}[dow]||0;
}

function initSem(){return{fR:{},campo:{},ped:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},invR:{}};}

function lsR(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function normCal(cal){
  var c=(cal||"").toLowerCase();
  if(c.indexOf("extra fancy")>=0||c.indexOf("xf")>=0||c==="fancy"||c.indexOf("fcy")>=0||c==="primera")return"Primera";
  if(c.indexOf("medium")>=0||c.indexOf("mdl")>=0||c.indexOf("mds")>=0||c==="segunda"||c==="#2")return"Segunda";
  if(c==="tercera"||c==="#3"||c==="choice"||c==="plain")return"Tercera";
  return cal||"";
}

// ── App ──────────────────────────────────────────────────────────────────────
function App(){
  var s0=lsR(LS)||{sem:null,sI:null};
  var sISaved=s0.sI;
  var sICurrent=getSem();

  var sTab=uS("balance");var tab=sTab[0];var setTab=sTab[1];
  var sSI=uS(sICurrent);var sI=sSI[0];var setSI=sSI[1];
  var sSemSel=uS(sICurrent);var semSel=sSemSel[0];var setSemSel=sSemSel[1];
  var sSem=uS(function(){return(s0.sem&&sISaved===sICurrent)?s0.sem:initSem();});
  var sem=sSem[0];var setSem=sSem[1];
  var sDi=uS(getDiHoy());var di=sDi[0];var setDi=sDi[1];
  var sJalC=uS(false);var jalC=sJalC[0];var setJalC=sJalC[1];
  var sJalP=uS(false);var jalP=sJalP[0];var setJalP=sJalP[1];
  var sJalCam=uS(false);var jalCam=sJalCam[0];var setJalCam=sJalCam[1];
  var sNotif=uS("");var notif=sNotif[0];var setNotif=sNotif[1];
  var sRR=uS(0);var reRender=sRR[0];var forceRender=sRR[1];
  var sBfP=uS("todos");var bfP=sBfP[0];var setBfP=sBfP[1];
  var sModSem=uS(false);var modSem=sModSem[0];var setModSem=sModSem[1];
  var sSubBal=uS("");var subBal=sSubBal[0];var setSubBal=sSubBal[1];
  var sJalMode=uS(null);var jalMode=sJalMode[0];var setJalMode=sJalMode[1];
  var sConx=uS("conectando");var conx=sConx[0];var setConx=sConx[1];
  var sActFR=uS(function(){try{var v=localStorage.getItem(LS+"_act");return v?JSON.parse(v):{}}catch(e){return{};}});
  var actFR=sActFR[0];var setActFR=sActFR[1];

  // Guardar en localStorage cuando sem cambia
  uE(function(){setDi(getDiHoy());setSI(getSem());},[]); // forzar día y semana actual al cargar
  uE(function(){lsS(LS,{sem:sem,sI:sI});},[sem,sI]);
  uE(function(){try{localStorage.setItem(LS+"_act",JSON.stringify(actFR));}catch(e){};},[actFR]);

  // ── Pedidos: parsear lista plana ─────────────────────────────────────────
  function procesarPed(data){
    if(!data)return;
    var nuevo={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    if(Array.isArray(data)){
      data.forEach(function(r){
        if(!r)return;
        var d=DIA_IDX[r.dia]||DIA_IDX[r.Dia];
        if(d===undefined)return;
        nuevo[d]=nuevo[d]||[];
        nuevo[d].push(r);
      });
    } else {
      Object.keys(data).forEach(function(di){
        var rows=data[di];
        if(!rows)return;
        var arr=Array.isArray(rows)?rows:Object.values(rows);
        var dIdx=parseInt(di);
        if(isNaN(dIdx))return;
        arr.forEach(function(r){if(r)nuevo[dIdx]=(nuevo[dIdx]||[]).concat([r]);});
      });
    }
    setSem(function(prev){
      var ns=JSON.parse(JSON.stringify(prev));
      ns.ped=nuevo;
      try{lsS(LS,{sem:ns,sI:sI});}catch(e){}
      return ns;
    });
    forceRender(function(n){return n+1;});
  }

  // ── Jalar Pedidos ────────────────────────────────────────────────────────
  function jalarPedidos(){
    setJalP(true);
    fetch(FB_PED+"/"+sI+"/ped.json").then(function(r){return r.json();}).then(function(data){
      setJalP(false);
      if(data)procesarPed(data);
    }).catch(function(){setJalP(false);});
  }

  // ── SSE Pedidos ──────────────────────────────────────────────────────────
  uE(function(){
    var sICopy=sI;
    var src=null;var timer=null;
    function conectar(){
      if(src)src.close();
      try{
        src=new EventSource(FB_PED+"/"+sICopy+"/ped.json");
        src.addEventListener("put",function(e){
          try{
            var p=JSON.parse(e.data);
            if(p&&p.data)procesarPed(p.data);
            setNotif(new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}));
            forceRender(function(n){return n+1;});
          }catch(err){}
        });
        src.onopen=function(){setConx("vivo");};
        src.onerror=function(){
          setConx("reconectando");
          if(src)src.close();
          timer=setTimeout(conectar,5000);
        };
      }catch(err){timer=setTimeout(conectar,5000);}
    }
    conectar();
    return function(){if(src)src.close();if(timer)clearTimeout(timer);};
  },[sI]);

  // ── Jalar Campo ──────────────────────────────────────────────────────────
  function jalarCampoTodo(){
    setJalCam(true);
    fetch(FB_C).then(function(r){return r.json();}).then(function(data){
      setJalCam(false);
      if(!data)return;
      setSem(function(prev){
        var ns=JSON.parse(JSON.stringify(prev));
        Object.keys(data).forEach(function(k){
          var pts=k.split("|");
          if(pts.length===3&&pts[0]===sI)ns.campo[k]=data[k];
        });
        try{lsS(LS,{sem:ns,sI:sI});}catch(e){}
        return ns;
      });
      forceRender(function(n){return n+1;});
    }).catch(function(){setJalCam(false);});
  }

  // ── SSE Campo ────────────────────────────────────────────────────────────
  // SSE para cuarto frío (produccion-v1) - solo cuando modo=con hoy
  uE(function(){
    if(jalMode!==true)return;
    var srcInv=null;var timerInv=null;
    function conectarInv(){
      if(srcInv)srcInv.close();
      try{
        srcInv=new EventSource(FB_INV);
        srcInv.onopen=function(){setConx("vivo");};
        srcInv.addEventListener("put",function(e){
          try{
            var p=JSON.parse(e.data);
            if(p&&p.data)doJalInv(true);
          }catch(err){}
        });
        srcInv.onerror=function(){
          if(srcInv)srcInv.close();
          timerInv=setTimeout(conectarInv,8000);
        };
      }catch(err){timerInv=setTimeout(conectarInv,8000);}
    }
    conectarInv();
    return function(){if(srcInv)srcInv.close();if(timerInv)clearTimeout(timerInv);};
  },[jalMode]);

  uE(function(){
    var sICopy=sI;
    var src=null;var timer=null;
    function conectarCampo(){
      if(src)src.close();
      try{
        src=new EventSource(FB_C);
        src.addEventListener("put",function(e){
          try{
            var p=JSON.parse(e.data);
            var d=p&&p.data;
            if(d&&typeof d==="object"){
              setSem(function(prev){
                var ns=JSON.parse(JSON.stringify(prev));
                Object.keys(d).forEach(function(k){
                  var pts=k.split("|");
                  if(pts.length===3&&pts[0]===sICopy)ns.campo[k]=d[k];
                });
                try{lsS(LS,{sem:ns,sI:sICopy});}catch(e){}
                return ns;
              });
              forceRender(function(n){return n+1;});
            }
          }catch(err){}
        });
        src.onerror=function(){
          if(src)src.close();
          timer=setTimeout(conectarCampo,5000);
        };
      }catch(err){timer=setTimeout(conectarCampo,5000);}
    }
    conectarCampo();
    return function(){if(src)src.close();if(timer)clearTimeout(timer);};
  },[sI]);

  // ── Guardar Factores ─────────────────────────────────────────────────────
  function savFR(ns){
    fetch(FB_FR,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(ns.fR||{})}).catch(function(){});
  }

  function setFR(rid,diaI,fruta,tipo,field,val){
    setSem(function(prev){
      var ns=JSON.parse(JSON.stringify(prev));
      if(!ns.fR)ns.fR={};
      var dk=String(diaI);
      if(!ns.fR[dk])ns.fR[dk]={};
      if(!ns.fR[dk][rid])ns.fR[dk][rid]={};
      if(!ns.fR[dk][rid][fruta])ns.fR[dk][rid][fruta]={};
      if(!ns.fR[dk][rid][fruta][tipo])ns.fR[dk][rid][fruta][tipo]={};
      ns.fR[dk][rid][fruta][tipo][field]=val;
      try{lsS(LS,{sem:ns,sI:sI});}catch(e){}
      savFR(ns);
      return ns;
    });
  }

  // ── Inventario Cuarto (savInvR) ───────────────────────────────────────────
  function savInvR(ns){
    fetch(FB_INR,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(ns.invR||{})}).catch(function(){});
  }

  function setInvR(rid,prod,tipo,cal,field,val){
    setSem(function(prev){
      var ns=JSON.parse(JSON.stringify(prev));
      if(!ns.invR)ns.invR={};
      if(!ns.invR[rid])ns.invR[rid]={};
      if(!ns.invR[rid][prod])ns.invR[rid][prod]={};
      if(!ns.invR[rid][prod][tipo])ns.invR[rid][prod][tipo]={};
      if(!ns.invR[rid][prod][tipo][cal])ns.invR[rid][prod][tipo][cal]={pres:"",cajas:0};
      ns.invR[rid][prod][tipo][cal][field]=val;
      try{lsS(LS,{sem:ns,sI:sI});}catch(e){}
      savInvR(ns);
      return ns;
    });
  }

  // ── doJalInv: jalar de produccion-v1 ─────────────────────────────────────
  function doJalInv(conHoy){
    setJalMode(conHoy);
    setJalC(true);
    fetch(FB_INV).then(function(r){return r.json();}).then(function(data){
      if(!data){setJalC(false);alert("Sin datos en producción");return;}
      var hoyStr=fechaLocalISO();
      var rM={"Cordillera":"crp","PBT":"pvt","PVT":"pvt","Forrajera":"f4h"};
      function nP(p){
        var s=(p||"").toUpperCase().trim();
        if(s.indexOf("12CT")>=0)return"12CT";
        if(s.indexOf("24S")>=0||s.indexOf("24'S")>=0)return"24S RPC";
        if(s.indexOf("BUSHEL")>=0)return"BUSHEL";
        if(s.indexOf("12X1")>=0)return"12X1 LB";
        if(s.indexOf("8X2")>=0)return"8X2 LBS";
        if(s.indexOf("XF")>=0)return"20 LBS XF";
        if(s.indexOf("MDL")>=0)return"20 LBS MDL";
        if(s.indexOf("MDS")>=0)return"20 LBS MDS";
        var lb=s.match(/(\d+)\s*LBS?/);if(lb)return lb[1]+" LBS";
        return p;
      }
      setSem(function(prev){
        var ns=JSON.parse(JSON.stringify(prev));
        if(!ns.invR)ns.invR={};
        ["Europeo","Minibel","Morron","Persa","Slicer"].forEach(function(prod){
          var allItems=(data[prod]&&data[prod].inventario)||[];
          if(!Array.isArray(allItems))allItems=Object.values(allItems||{}).filter(Boolean);
          var items=conHoy?allItems:allItems.filter(function(it){
            var f=it.fecha||it.fechaInventario||"";return f<hoyStr;
          });
          items.forEach(function(item){
            var rid=rM[item.rancho];if(!rid)return;
            var tipo=(item.tipoProd==="Organico"||item.organico===true)?"org":"conv";
            var cn=normCal(item.calidad);
            var cal=cn==="Primera"?"1":cn==="Segunda"?"2":"3";
            var pres=nP(item.presentacion);
            var cajas=nv(item.cajas);
            if(!ns.invR[rid])ns.invR[rid]={};
            if(!ns.invR[rid][prod])ns.invR[rid][prod]={};
            if(!ns.invR[rid][prod][tipo])ns.invR[rid][prod][tipo]={};
            if(!ns.invR[rid][prod][tipo][cal])ns.invR[rid][prod][tipo][cal]={pres:pres,cajas:0};
            ns.invR[rid][prod][tipo][cal].cajas+=cajas;
          });
        });
        try{lsS(LS,{sem:ns,sI:sI});}catch(e){}
        savInvR(ns);
        return ns;
      });
      setJalC(false);
      alert(conHoy?"✓ Inventario cargado (incluye hoy)":"✓ Inventario cargado (solo días anteriores)");
    }).catch(function(e){setJalC(false);alert("Error: "+e.message);});
  }

  // ── getRejRancho ─────────────────────────────────────────────────────────
  function getRejRancho(rid,fruta,diaI,tipo){
    var key=sI+"|"+rid+"|"+diaI;
    var d=sem.campo[key];if(!d)return 0;
    var f=d[fruta];if(!f)return 0;
    if(tipo==="org")return nv(f.rej_org||f.rejOrg);
    return nv(f.rej_conv||f.rejConv||f.rej);
  }

  // ── calcD: proyección del día ─────────────────────────────────────────────
  function calcD(diaI){
    var fr=(sem.fR&&sem.fR[String(diaI)])||{};
    var res={Persa:{org:{kP:0,kS:0},conv:{kP:0,kS:0}},
             Minibel:{org:{kP:0},conv:{kP:0}},
             Slicer:{org:{kgP:0,kgPl:0,kgMer:0,pzT:0,kgT:0},conv:{kgP:0,kgPl:0,kgMer:0,pzT:0,kgT:0}},
             Europeo:{org:{pzP:0,pzS:0,pzC:0,kgP:0,kgS:0,kgC:0},conv:{pzP:0,pzS:0,pzC:0,kgP:0,kgS:0,kgC:0}},
             Morron:{}};
    CM.forEach(function(col){res.Morron[col.id]={org:{kT:0,kPri:0,kCho:0,kL:0,kXL:0,kJB:0,kSm:0,kMed:0},conv:{kT:0,kPri:0,kCho:0,kL:0,kXL:0,kJB:0,kSm:0,kMed:0}};});

    RANCHOS.forEach(function(rid){
      var frR=fr[rid]||{};
      var prods=RPRODS[rid]||[];

      prods.forEach(function(prod){
        TIPOS.forEach(function(tipo){
          var rj=getRejRancho(rid,prod,diaI,tipo);if(!rj)return;
          var f=(frR[prod]&&frR[prod][tipo])||{};

          if(prod==="Persa"){
            res.Persa[tipo].kP+=r2(rj*nv(f.fpri)*9.25);
            res.Persa[tipo].kS+=r2(rj*nv(f.fseg)*9.25);
          } else if(prod==="Minibel"){
            res.Minibel[tipo].kP+=r2(rj*nv(f.fpri)*5.70);
          } else if(prod==="Slicer"){
            var pz=rj*nv(f.pzRej);
            var kgTot=pz*(nv(f.kgPz)||0.4);
            res.Slicer[tipo].pzT+=pz;
            res.Slicer[tipo].kgT+=kgTot;
            res.Slicer[tipo].kgP+=r2(pz*nv(f.rPri)*(nv(f.kgPz)||0.4));
            res.Slicer[tipo].kgPl+=r2(pz*nv(f.rPl)*(nv(f.kgPz)||0.4));
            res.Slicer[tipo].kgMer+=r2(pz*nv(f.rMer)*(nv(f.kgPz)||0.4));
          } else if(prod==="Europeo"){
            // rj = cajas de campo; pzCaja = piezas por caja
            var pzTot=rj*nv(f.pzCaja);
            res.Europeo[tipo].pzP+=Math.round(pzTot*nv(f.rPri));
            res.Europeo[tipo].pzS+=Math.round(pzTot*nv(f.rSeg));
          } else if(prod==="Morron"){

              var fc=(frR["Morron"]&&frR["Morron"][col.id]&&frR["Morron"][col.id][tipo])||{};
              var cajM=getRejRancho(rid,"Morron",diaI,tipo);

              var kgTot=cajM*nv(fc.kgCaja);
              var kgPri=r2(kgTot*nv(fc.rPri));
              var kgCho=r2(kgTot*nv(fc.rCho));
              res.Morron[col.id][tipo].kT+=r2(kgTot);
              res.Morron[col.id][tipo].kPri+=r2(kgPri);
              res.Morron[col.id][tipo].kCho+=r2(kgCho);
              res.Morron[col.id][tipo].kL+=r2(kgPri*nv(fc.rL));
              res.Morron[col.id][tipo].kXL+=r2(kgPri*nv(fc.rXL));
              res.Morron[col.id][tipo].kJB+=r2(kgPri*nv(fc.rJB));
              if(col.id==="verde"){
                res.Morron[col.id][tipo].kSm+=r2(kgPri*nv(fc.rSm));
                res.Morron[col.id][tipo].kMed+=r2(kgPri*nv(fc.rMed));
              }
            });
          }
        });
      });
    });
    return res;

                    <td style={{textAlign:"right",padding:"6px 8px",fontWeight:700}}>{Math.round(r.kP).toLocaleString()}</td>
                    <td style={{textAlign:"right",padding:"6px 8px",color:"#fbbf24",fontWeight:700}}>{Math.round(r.kPed).toLocaleString()}</td>
                    <td style={{textAlign:"right",padding:"6px 8px",color:r.kD>=0?"#4ade80":"#ef4444",fontWeight:900,fontSize:13}}>{Math.round(r.kD).toLocaleString()}</td>
                  </tr>
                );})}</tbody>
              </table>
            );
          })()}
        </div>
      )}

    </div>
  );
}

try{
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
}catch(err){
  document.getElementById("root").innerHTML="<div style='color:red;padding:20px;font-size:13px;font-family:monospace'>ERROR: "+err.message+"<br>"+err.stack+"</div>";
}
</script>
</body>
</html>
