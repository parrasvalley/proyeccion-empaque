<script>
// -- Constantes --------------------------------------------------------
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var FB_C=FB+"/proyeccion-campo-v1.json";
var FB_PED=FB+"/campo-proy-semanas-v1";

function invURL(){return FB_PED+"/"+ST.sI+"/inv.json";}
// Firebase rechaza "/" en los nombres de campo (error 400). Se cambia por "~".
function invEsc(o){
  if(!o||typeof o!=="object")return o;
  var r={};
  Object.keys(o).forEach(function(k){
    var v=o[k];
    r[String(k).replace(/\//g,"~")]=(v&&typeof v==="object")?invEsc(v):v;
  });
  return r;
}
function invDes(o){
  if(!o||typeof o!=="object")return o;
  var r={};
  Object.keys(o).forEach(function(k){
    var v=o[k];
    var kk=String(k).replace(/~/g,"/");
    if(v&&typeof v==="object"){v=invDes(v);if(v.pres)v.pres=String(v.pres).replace(/~/g,"/");}
    r[kk]=v;
  });
  return r;
}
function aplicaInv(d,marca){
  if(!d||!d.invR)return 0;
  ST.sem.invR=d.invR;ST.sem.kgInv=d.kgInv||{};
  var nc=0;
  try{Object.keys(d.invR).forEach(function(rid){var r=d.invR[rid]||{};
    Object.keys(r).forEach(function(pr){var t=r[pr]||{};
      Object.keys(t).forEach(function(tp){var c=t[tp]||{};
        Object.keys(c).forEach(function(ca){var ps=c[ca]||{};
          Object.keys(ps).forEach(function(pk){nc+=nv((ps[pk]||{}).cajas);});});});});});}catch(e){}
  try{saveST();}catch(e2){}
  return nc;
}
var LS="pvt_proy_v5";
var RANCHOS=["pvt","crp","f4h"];
var RL={pvt:"PVT",crp:"Cordillera",f4h:"Forrajera"};
var RPRODS={pvt:["Persa","Slicer"],crp:["Persa","Slicer","Europeo","Morron","Minibel"],f4h:["Persa","Morron","Minibel"]};
var DIAS=["Vie","Sab","Dom","Lun","Mar","Mie","Jue"];
var TIPOS=["org","conv"];
var GRN="#86c87a";
var CM=[{id:"rojo",l:"Rojo",c:"#ef4444"},{id:"naranja",l:"Naranja",c:"#f97316"},{id:"amarillo",l:"Amarillo",c:"#eab308"},{id:"verde",l:"Verde",c:"#22c55e"}];
var KG_CAJA={"20 LBS":9.25,"20 LBS XF":9.25,"20 LBS MDL":9.25,"20lb":9.25,"12X1 LB":5.70,"12X1 LB RPC":5.70,"12X1 LB CV":5.70,"12X1 LBS STO":5.70,"12x1":5.70,"8X2 LBS":7.60,"8x2":7.60,"25 LBS":11.57,"1/9 PLAIN":23.13,"25 LB XL OG GREEN":11.57,"25lb":11.57,"50 LBS":23.13,"50lb":23.13,"18CT":5.44,"18ct":5.44,"12X8 OZ":2.88,"12X8OZ":2.88,"12x8oz":2.88,"22/24":5.08,"24CT":5.08,"24ct":5.08,"24 CT RED":5.08,"24 CT ORANGE":5.08,"24 CT YELLOW":5.08,"24 CT GREEN":5.08,"36CT":11.70,"36ct":11.70,"36CT OG":11.70,"11 LBS":5.13,"11LBS":5.13,"11lb":5.13,"11LB YELLOW":5.13,"11LB RED":5.13,"11LB ORANGE":5.13,"11LB GREEN":5.13,"30LB":13.61,"30lb":13.61,"30 LBS":13.61,"175 PZS":13.61,"175 PZS XF":13.61,"175PZS":13.61,"175PZSXF":13.61,"175 PIEZAS":13.61,"12ct":5.44,"12CT SM":5.44,"12CT M":5.44,"12ct_small":5.44,"12ct_mediano":5.44,"12x1lb":5.70,"12X1LB":5.70,"12x8oz":2.88,"12X8OZ":2.88,"18lb":8.30,"18 lb":8.30,"18LB":8.30,"RPC 35lb":15.88,"RPC35LB":15.88,"11lb":5.13,"11LB":5.13,"12x2":5.00,"12X2":5.00,"12X2CT MIX":5.00,"8x6":5.44,"8X6":5.44,"BELL MIX 8X6":5.44,"1/9 bushel":11.57,"1/9BUSHEL":11.57,"25lb":11.57,"50lb":23.13,"62 piezas":11.57,"small":5.08,"SMALL":5.08,"25LB":11.34,"1/9 bushel":8.16,"12ct":5.08,"12x2":5.00,"10lb":4.54,"15lb":6.80};
var PZS_CAJA={"12CT":12,"24S RPC":24,"24CT":24,"BUSHEL":45,"33PZ":33,"33 PZ":33,"33CT":33,"30CT":30,"48CT":48,"36CT":36};

// -- Estado global -----------------------------------------------------
var _hoy=new Date(),_dow=_hoy.getDay();
// Dias desde el viernes mas reciente: (dow-5+7)%7
var _dFri=(_dow-5+7)%7;
var _vie=new Date(_hoy);_vie.setDate(_hoy.getDate()-_dFri);
var _semAuto=_vie.getFullYear()+"-"+String(_vie.getMonth()+1).padStart(2,"0")+"-"+String(_vie.getDate()).padStart(2,"0");
var ST={
  sI:_semAuto,di:0,_jalMsg:"",_campoMsg:"",jalCam:false,tab:"balance",bfP:"todos",subBal:"",modSem:false,jalMode:null,balModo:"dia",fRancho:"todos",fProd:"todos",fTipo:"todos",fCal:"todos",
  sem:{fR:{},campo:{},ped:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},invR:{}},
  actFR:{},jalC:false,jalCam:false
};

// -- Helpers ------------------------------------------------------------
function nv(x){return(typeof x==="number"&&!isNaN(x))?x:(parseFloat(x)||0);}
function r2(x){return Math.round(x*100)/100;}
function getSem(){var d=new Date();var off={5:0,6:1,0:2,1:3,2:4,3:5,4:6}[d.getDay()]||0;var f=new Date(d);f.setDate(d.getDate()-off);var m=f.getMonth()+1;var dd=f.getDate();return f.getFullYear()+"-"+(m<10?"0"+m:m)+"-"+(dd<10?"0"+dd:dd);}
function getDiHoy(){return {5:0,6:1,0:2,1:3,2:4,3:5,4:6}[new Date().getDay()]||0;}
function fechaISO(){var d=new Date();var m=d.getMonth()+1;var dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0"+m:m)+"-"+(dd<10?"0"+dd:dd);}
function lsR(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getCountFromPres(pres){
  var p=(pres||"").toUpperCase().replace(/\s/g,"");
  var m=p.match(/^(\d+)CT/);if(m)return parseInt(m[1]);
  var m2=p.match(/^(\d+)PZ/);if(m2)return parseInt(m2[1]);
  if(p.indexOf("22/24")>=0||p.indexOf("2224")>=0)return 24;
  if(p.indexOf("1/9")>=0)return 9;
  if(p.indexOf("BUSHEL")>=0)return 45;
  return 0;
}
// Kg por caja de conteo: peso de la pieza x el count (Slicer)
var KG_PZ_SLICER=0.325;
function kgCajaProd(pres,fruta){
  var f=normFruta((fruta||"").replace(/ OG$| ORG$/,"").trim());
  if(f==="Slicer"){
    var u=(pres||"").toUpperCase().replace(/\s/g,"");
    var m=u.match(/^(\d+)(CT|PIEZAS|PZS|PZ)/);
    if(m)return Math.round(parseInt(m[1],10)*KG_PZ_SLICER*100)/100;
  }
  return KG_CAJA[pres]||KG_CAJA[(pres||"").toUpperCase()]||0;
}
function getKgPzFactor(fruta,tipo){
  // kgPz promedio de todos los ranchos activos para este cultivo y tipo
  var total=0,cnt=0;
  var dk=String(ST.di);
  RANCHOS.forEach(function(rid){
    var fv=(ST.sem.fR&&ST.sem.fR[dk]&&ST.sem.fR[dk][rid]&&ST.sem.fR[dk][rid][fruta]&&ST.sem.fR[dk][rid][fruta][tipo])||{};
    var k=nv(fv.kgPz);if(k>0){total+=k;cnt++;}
  });
  return cnt>0?r2(total/cnt):0;
}
function eqTalla(a,b){function n(x){x=(x||"").toUpperCase();return x==="LARGE"?"L":x;}return n(a)===n(b);}
function normTallaMorron(pres){
  var p=(pres||"").toUpperCase().replace(/\s/g,"");
  if(p.indexOf("22/24")>=0||p.indexOf("2224")>=0||p==="XL"||p.indexOf("XL")>=0)return"XL";
  if(p.indexOf("JUMBO")>=0||p.indexOf("JB")>=0)return"Jumbo";
  if(p.indexOf("SMALL")>=0||p.indexOf("SM")>=0)return"Small";
  if(p.indexOf("MED")>=0&&p.indexOf("SMALL")<0)return"Med";
  if(p.indexOf("36CT")>=0||p==="L")return"L";
  if(p.indexOf("24CT")>=0||p.indexOf("24 CT")>=0)return"XL";
  return"L";
}
function normCal(c){var s=(c||"").toLowerCase().replace(/^#/,"").trim();if(s==="1"||s.indexOf("fancy")>=0||s.indexOf("xf")>=0||s==="primera"||s.indexOf("first")>=0||s==="super"||s==="selecto"||s==="large"||s.indexOf("super")>=0||s.indexOf("selecto")>=0)return"Primera";if(s==="2"||s.indexOf("mdl")>=0||s.indexOf("mds")>=0||s==="segunda"||s==="second")return"Segunda";if(s==="3"||s==="tercera"||s==="choice"||s==="merma"||s==="third"||s==="chofer"||s==="plain"||s==="bushel"||s.indexOf("bushel")>=0)return"Tercera";return c||"";}
function normFruta(f){var s=(f||"").toLowerCase().replace(/[^a-z0-9]/g,"");if(s.indexOf("persa")>=0)return"Persa";if(s.indexOf("euro")>=0)return"Europeo";if(s.indexOf("slicer")>=0)return"Slicer";if(s.indexOf("minibell")>=0||s.indexOf("minibel")>=0)return"Minibel";if(s.indexOf("rojo")>=0||s.indexOf("red")>=0)return"Morron_rojo";if(s.indexOf("naranja")>=0)return"Morron_naranja";if(s.indexOf("amarillo")>=0)return"Morron_amarillo";if(s.indexOf("verde")>=0||s.indexOf("green")>=0)return"Morron_verde";if(s.indexOf("bell")>=0||s.indexOf("morron")>=0)return"Morron";return f||"";}
function isOrg(f){var s=(f||"").toUpperCase();return s.indexOf(" OG")>=0||s.indexOf(" ORG")>=0||s.indexOf("ORGAN")>=0;}
function normSemFecha(s){if(!s)return"";s=String(s).trim();if(s.length===10&&s[4]==="-"&&s[7]==="-")return s;if(s.length===10&&s[2]==="/"&&s[5]==="/")return s.slice(6)+"-"+s.slice(3,5)+"-"+s.slice(0,2);if(s.length===8)return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);return s;}
function getRej(rid,prod,diaI,tipo){
  var k=ST.sI+"|"+rid+"|"+diaI;var d=ST.sem.campo[k];if(!d)return 0;
  var total=0;
  Object.keys(d).forEach(function(campoNom){
    var normN=normFruta(campoNom);
    // "Morron" generico matchea todos los colores
    var match=(normN===prod)||(prod==="Morron"&&normN.indexOf("Morron")===0);
    if(!match)return;
    var cultData=d[campoNom];
    if(!cultData||!cultData[tipo])return;
    var val=cultData[tipo];
    var rejas=typeof val==="object"?nv(val.rejas):nv(val);
    total+=rejas;
  });
  return r2(total);
}
function getPeds(diaI){return ST.sem.ped[diaI]||[];}
function saveST(){
  lsS(LS+"_fR",ST.sem.fR||{});
  lsS(LS+"_act",ST.actFR||{});
  lsS(LS,{sem:ST.sem,actFR:ST.actFR});
}
function savSemFR2(){
  var fR=ST.sem.fR||{};
  fetch(FB_FR,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(fR)}).catch(function(){});
  saveST();
}

// -- calcD -------------------------------------------------------------
function calcD(diaI){
  var fr=(ST.sem.fR&&ST.sem.fR[String(diaI)])||{};
  var res={Persa:{org:{kP:0,kS:0},conv:{kP:0,kS:0}},Minibel:{org:{kP:0,kS:0},conv:{kP:0,kS:0}},
    Slicer:{org:{kgP:0,kgPl:0,kgMer:0},conv:{kgP:0,kgPl:0,kgMer:0}},
    Europeo:{org:{pzP:0,pzS:0,pzC:0},conv:{pzP:0,pzS:0,pzC:0}},Morron:{}};
  CM.forEach(function(col){var base={kTot:0,kTer:0,kL:0,kXL:0,kJB:0,kS:0,kM:0};res.Morron[col.id]={org:JSON.parse(JSON.stringify(base)),conv:JSON.parse(JSON.stringify(base))};});
  RANCHOS.forEach(function(rid){
    var frR=fr[rid]||{};
    (RPRODS[rid]||[]).forEach(function(prod){
      TIPOS.forEach(function(tipo){
        var rj=getRej(rid,prod,diaI,tipo);if(!rj)return;
        var f=(frR[prod]&&frR[prod][tipo])||{};
        if(prod==="Persa"){res.Persa[tipo].kP+=r2(rj*nv(f.fpri)*9.25);res.Persa[tipo].kS+=r2(rj*nv(f.fseg)*9.25);}
        else if(prod==="Minibel"){res.Minibel[tipo].kP+=r2(rj*nv(f.fpri)*5.70);res.Minibel[tipo].kS+=r2(rj*nv(f.fseg)*5.70);}
        else if(prod==="Slicer"){var kg=rj*(nv(f.kgPz)||0);if(!kg)return;res.Slicer[tipo].kgP+=r2(kg*nv(f.rPri)/100);res.Slicer[tipo].kgPl+=r2(kg*nv(f.rPl)/100);res.Slicer[tipo].kgMer+=r2(kg*nv(f.rMer)/100);}
        else if(prod==="Europeo"){var pzT=rj*nv(f.pzCaja);res.Europeo[tipo].pzP+=Math.round(pzT*nv(f.rPri)/100);res.Europeo[tipo].pzS+=Math.round(pzT*nv(f.rSeg)/100);res.Europeo[tipo].pzC+=Math.round(pzT*nv(f.rCho)/100);}
        else if(prod==="Morron"&&tipo==="conv"){CM.forEach(function(col){var fc=(frR.Morron&&frR.Morron[col.id]&&frR.Morron[col.id]["conv"])||{};var cajM=getRej(rid,"Morron",diaI,"conv");if(!cajM)return;var kgT=cajM*nv(fc.kgCaja);var kgPri=r2(kgT*nv(fc.rPri)/100);var kgTer=r2(kgT*nv(fc.rTer)/100);var mr=res.Morron[col.id][tipo];mr.kTot+=r2(kgT);mr.kTer+=kgTer;if(col.id==="verde"){mr.kS+=r2(kgPri*nv(fc.rS));mr.kM+=r2(kgPri*nv(fc.rM));mr.kL+=r2(kgPri*nv(fc.rL));mr.kXL+=r2(kgPri*nv(fc.rXL));mr.kJB+=r2(kgPri*nv(fc.rJB));}else{mr.kL+=r2(kgPri*nv(fc.rL));mr.kXL+=r2(kgPri*nv(fc.rXL));mr.kJB+=r2(kgPri*nv(fc.rJB));}});}
      });  // fin TIPOS.forEach
    });  // fin RPRODS.forEach
  });  // fin RANCHOS.forEach
  return res;
}
function jalarPedidos(){
  if(!ST.sI){ST._jalMsg="Sin semana seleccionada";renderTab();return;}
  ST.jalC=true;ST._jalMsg="Jalando...";renderTab();
  fetch(FB_PED+"/"+ST.sI+"/ped.json",{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(data){
      ST.jalC=false;
      if(!data){ST._jalMsg="No hay pedidos en Firebase (sem "+ST.sI+")";renderTab();return;}
      var n=Array.isArray(data)?data.length:Object.keys(data).length;
      procesarPed(data);saveST();
      ST._jalMsg="OK - "+n+" pedidos jalados (sem "+ST.sI+")";
      renderTab();
    })
    .catch(function(e){
      ST.jalC=false;
      ST._jalMsg="Error: "+e.message+" (sem="+ST.sI+")";
      renderTab();
    });
}

function jalarCampoTodo(){
  ST.jalCam=true;ST._campoMsg="Jalando campo...";renderTab();
  var paths=["/proyeccion-campo-v1.json","/campo-proyeccion-v1.json","/proyeccion-campo.json","/campo-proyeccion.json"];
  var idx=0;
  var DIA2I={Vie:0,Sab:1,Dom:2,Lun:3,Mar:4,Mie:5,Jue:6};
  function tryPath(){
    if(idx>=paths.length){
      ST.jalCam=false;
      ST._campoMsg="No encontrado en: "+paths.join(", ");
      renderTab();return;
    }
    var url=FB+paths[idx++];
    fetch(url).then(function(r){return r.json();}).then(function(data){
      if(!data||Object.keys(data).length===0){tryPath();return;}
      // Encontrado - procesar datos
      ST.jalCam=false;
      var todasClaves=Object.keys(data);
      var siNorm=normSemFecha(ST.sI);
      var nuevoCampo={};var clavesEnc=0;
      todasClaves.forEach(function(k){

function getUltimoKgPz(prod,tipo){
  // Buscar factores: kgPz=kg/reja, pzRej=piezas/reja -> devuelve kg/PIEZA = kgPz/pzRej
  var fR=ST.sem.fR||{};
  for(var d=6;d>=0;d--){
    var dk=String(d);if(!fR[dk])continue;
    var rids=Object.keys(fR[dk]);
    for(var ri=0;ri<rids.length;ri++){
      var rid=rids[ri];
      var fv=(fR[dk][rid]&&fR[dk][rid][prod]&&fR[dk][rid][prod][tipo])||{};
      var kgReja=nv(fv.kgPz);var pzRej=nv(fv.pzRej);
      if(kgReja>0&&pzRej>0)return r2(kgReja/pzRej); // kg por pieza
      if(kgReja>0)return kgReja; // si no hay pzRej, devuelve kgReja como fallback
    }
  }
  return 0;
}

    var _euroFechas={hoy:0,ant:0,sinF:0,muestras:[]};
    if(data["Europeo"]&&data["Europeo"].inventario){
      var _euroArr=Array.isArray(data["Europeo"].inventario)?data["Europeo"].inventario:Object.values(data["Europeo"].inventario||{}).filter(Boolean);
      _euroArr.forEach(function(it){

      });
    }

      itemsF.forEach(function(it){

        var rid=rN.indexOf("cord")>=0||rN==="crp"||rN==="cpr"?"crp":rN.indexOf("pvt")>=0||rN.indexOf("pbt")>=0||rN==="pvt"?"pvt":rN.indexOf("forr")>=0||rN==="f4h"?"f4h":null;
        if(!rid){_diagRanchos["SIN_MAP:"+rK]=(_diagRanchos["SIN_MAP:"+rK]||0)+1;_d.sinRancho++;return;}
        var tipo=(it.tipoProd==="Organico"||it.organico===true)?"org":"conv";
        if(tipo==="org")_d.org++;else _d.conv++;
        _diagRanchos[rK+"="+tipo]=(_diagRanchos[rK+"="+tipo]||0)+1;
        _diagTipos[(it.tipoProd||"sin_campo")+"->"+tipo]=(_diagTipos[(it.tipoProd||"sin_campo")+"->"+tipo]||0)+1;
        // Diagnostico de calidades
        var _ck=(it.calidad||"sin_cal")+"->("+normCal(it.calidad||"")+")";
        _diagTipos[_ck]=(_diagTipos[_ck]||0)+1;
        // Aviso si PVT/Cordillera viene como conv (deberia ser org)
        if((it.rancho==="PVT"||it.rancho==="PBT"||it.rancho==="Cordillera")&&tipo==="conv"){
          if(!ST._invWarnings)ST._invWarnings=[];
          ST._invWarnings.push("Aviso: "+(it.rancho||"")+" registrado como Convencional (debe ser Organico) - fecha:"+(it.fecha||it.fechaInventario||"?"));
        }
        var calNorm=normCal(it.calidad);
        var cal=calNorm==="Tercera"?"3":calNorm==="Segunda"?"2":"1"; // vacio/desconocido = Primera
        var pres=((it.presentacion||it.subcalidad)||"sin_pres").replace(/[ ]/g,"_").toLowerCase();
        var presUp=((it.presentacion||it.subcalidad)||"").toUpperCase().replace(/[ ]/g,"");
        var presReal=it.presentacion||it.subcalidad||"";
        var presUp2=presReal.toUpperCase().replace(/[ ]/g,"");
        var tamKey=presReal+(it.tamano?("_"+(it.tamano||"").toLowerCase()):"");
        var kgCaja=KG_CAJA[tamKey]||KG_CAJA[presReal]||KG_CAJA[presUp2]||KG_CAJA[it.presentacion]||KG_CAJA[presUp]||0;
        if(!kgCaja){
          // Presentacion de conteo: usar kgPz del ultimo factor conocido
          var cnt=getCountFromPres(it.presentacion||"");
          if(cnt>0){
            var kgPzU=getUltimoKgPz(prod,tipo);
            kgCaja=kgPzU*cnt;
          }
        }
        var kg=r2(nv(it.cajas)*kgCaja);
        var inv=ST.sem.invR;
        if(!inv[rid])inv[rid]={};
        if(!inv[rid][prodNorm])inv[rid][prodNorm]={};
        if(!inv[rid][prodNorm][tipo])inv[rid][prodNorm][tipo]={};
        if(!inv[rid][prodNorm][tipo][cal])inv[rid][prodNorm][tipo][cal]={};
        if(!inv[rid][prodNorm][tipo][cal][pres])inv[rid][prodNorm][tipo][cal][pres]={pres:it.presentacion||"",cajas:0,kg:0};
        inv[rid][prodNorm][tipo][cal][pres].cajas+=nv(it.cajas);
        inv[rid][prodNorm][tipo][cal][pres].kg+=kg;
        // Diagnostico Euro
        if(prodNorm==="Europeo"){
          var _ek=cal+"|"+tipo+"|"+(it.presentacion||"?")+"|caj:"+(it.cajas||"?");
          _diagTipos["EUR:"+_ek]=(_diagTipos["EUR:"+_ek]||0)+1;

        var pt=((invR2[rid]||{})[prod])||{};
        Object.keys(pt).forEach(function(tipo){
          Object.keys(pt[tipo]||{}).forEach(function(cal){
            Object.keys(pt[tipo][cal]||{}).forEach(function(pk){
              var cj=nv((pt[tipo][cal][pk]||{}).cajas);cajProd+=cj;totalCaj+=cj;
            });
          });
        });
      });
      if(cajProd>0)diagArr.push(prod+":"+cajProd);
    });
    // Pre-calcular kg por producto/tipo/cal para uso directo en balance
    var kgInv={};
    var invR4=ST.sem.invR||{};
    ["pvt","crp","f4h"].forEach(function(rid){
      var rd=invR4[rid]||{};
      Object.keys(rd).forEach(function(prod){
        if(!kgInv[prod])kgInv[prod]={};
        Object.keys(rd[prod]||{}).forEach(function(tipo){
          if(!kgInv[prod][tipo])kgInv[prod][tipo]={};
          Object.keys(rd[prod][tipo]||{}).forEach(function(cal){
            if(!kgInv[prod][tipo][cal])kgInv[prod][tipo][cal]=0;

              kgInv[prod][tipo][cal]+=nv((rd[prod][tipo][cal][pk]||{}).kg);
            });
          });
        });
      });
    });
    ST.sem.kgInv=kgInv;
    ST._jalMsg="OK:"+totalCaj.toLocaleString()+" cj | Mini org1="+Math.round((kgInv.Minibel&&kgInv.Minibel.org&&kgInv.Minibel.org["1"])||0)+"kg";
    saveST();renderTab();
  }).catch(function(x){ST.jalC=false;ST._jalMsg="Error: "+x.message;renderTab();});
}

function h(tag,attrs,inner){
  var el=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object"){Object.assign(el.style,attrs[k]);}
    else if(k==="className"){el.className=attrs[k];}
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else el.setAttribute(k,attrs[k]);
  });
  if(inner!=null){
    if(typeof inner==="string"||typeof inner==="number")el.textContent=inner;
    else if(Array.isArray(inner))inner.forEach(function(c){if(c)el.appendChild(typeof c==="string"?document.createTextNode(c):c);});
    else if(inner instanceof Node)el.appendChild(inner);
  }
  return el;
}

// -- Importar pedidos desde el link (#ped=base64) -----------------------
function importHash(){
  var h=String(location.hash||"");
  var i=h.indexOf("ped=");
  if(i<0)return false;
  var b64=h.slice(i+4);
  var pl=null;
  try{pl=JSON.parse(atob(b64));}catch(e){ST._jalMsg="Link de pedidos ilegible: "+e.message;return false;}
  if(!pl){ST._jalMsg="Link ilegible";return false;}
  if(pl.inv&&pl.inv.invR){
    var nInv=aplicaInv(pl.inv,"link");
    ST.tab="balance";
    if(pl.s)ST.sI=pl.s;
    ST._jalMsg="Inventario cargado: "+Math.round(nInv).toLocaleString()+" cajas";
    try{history.replaceState(null,"",location.pathname+location.search);}catch(e9){}
    // Firebase rechaza escribir en /inv pero SI acepta /ped. El inventario
    // viaja como un renglon mas de la lista de pedidos, marcado con _inv.
    var lista=(ST.sem.pedFlat||[]).filter(function(x){return x&&!x._inv;});
    var conInv=lista.concat([{_inv:1,invR:invEsc(pl.inv.invR),kgInv:invEsc(pl.inv.kgInv||{}),ts:Date.now()}]);
    fetch(FB_PED+"/"+ST.sI+"/ped.json",{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(conInv)})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(){ST._jalMsg+=" (guardado)";renderTab();})
      .catch(function(e){ST._jalMsg+=" (no se guardo: "+e.message+")";renderTab();});
    if(!pl.p||!pl.p.length)return true;
  }
  if(!pl.p||!pl.p.length){ST._jalMsg="El link no trae pedidos";return false;}
  var sem=pl.s||ST.sI;
  var esperados=pl.p.length;
  ST.sI=sem;
  ST.tab="pedidos";
  procesarPed(pl.p);
  ST._jalMsg="Importando "+esperados+" pedidos (sem "+sem+")...";
  try{history.replaceState(null,"",location.pathname+location.search);}catch(eH){}
  fetch(FB_PED+"/"+sem+"/ped.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(pl.p)})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(){return fetch(FB_PED+"/"+sem+"/ped.json?cache=no-store");})
    .then(function(r){return r.json();})
    .then(function(d){
      var arr=d?(Array.isArray(d)?d:Object.keys(d).map(function(k){return d[k];})):[];
      var n=arr.filter(function(x){return x;}).length;
      ST._jalMsg=(n===esperados?"LISTO - ":"OJO - ")+n+" de "+esperados+" pedidos en Firebase (sem "+sem+")";
      renderTab();
    })
    .catch(function(e){
      ST._jalMsg="Pedidos cargados aqui, pero Firebase fallo: "+e.message;
      renderTab();
    });
  return true;
}

// -- Inicializacion ----------------------------------------------------
try{
  (function init(){
    var saved=lsR(LS)||{};
    ST.sI=getSem();ST.di=getDiHoy();
    if(saved.sem)ST.sem=saved.sem;
    ST.actFR=lsR(LS+"_act")||{};
    // Restaurar factores de clave separada (mas persistente)
    try{var fRSaved=lsR(LS+"_fR");if(fRSaved&&typeof fRSaved==="object"&&Object.keys(fRSaved).length>0){ST.sem.fR=fRSaved;}}catch(eF){}
    // Firebase MANDA sobre localStorage. Lo local solo sirve para pintar
    // rapido mientras llega la respuesta, y siempre se sobrescribe.
    fetch(FB_FR+"?t="+Date.now()).then(function(r){return r.json();}).then(function(d){
      if(d&&typeof d==="object"&&Object.keys(d).length>0){
        ST.sem.fR=d;
        try{lsS(LS+"_fR",d);}catch(e){}
        renderTab();
      }
    }).catch(function(){});
    try{importHash();}catch(eIH){ST._jalMsg="Error importando link: "+eIH.message;}
    try{renderHeader();}catch(e1){
      console.error("renderHeader error:",e1);
      document.getElementById("content").innerHTML="<div style='color:#ff6b6b;padding:20px;font-family:monospace'>Error en header: "+e1.message+"</div>";
      return;
    }
    try{renderTab();}catch(e2){
      document.getElementById("content").innerHTML=
        "<div style='color:#ff6b6b;background:#1a0000;padding:20px;font-family:monospace;font-size:12px'>"+
        "Error: "+e2.message+"</div>";
    }
    fetch(invURL()+"?t="+Date.now()).then(function(r){return r.json();}).then(function(d){
      if(d&&d.invR){aplicaInv(d,"firebase");renderTab();}
    }).catch(function(){});
    initSSE();
    try{
      var _si=new EventSource(invURL());
      _si.addEventListener("put",function(ev){
        try{var q=JSON.parse(ev.data);if(q&&q.data&&q.data.invR){aplicaInv(q.data,"sse");renderTab();}}catch(x){}
      });
      _si.onerror=function(){};
    }catch(x){}
  })();
}catch(e){
  document.getElementById("content").innerHTML=
    "<div style='color:#ff6b6b;background:#1a0000;padding:20px;font-family:monospace;font-size:12px'>"+
    "Error init: "+e.message+"</div>";
}
