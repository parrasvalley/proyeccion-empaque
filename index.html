<!DOCTYPE html>
<html lang="es">
<head>

  <style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0c0f07;color:#e8e0c8;font-family:system-ui;min-height:100vh;}
.hdr{background:linear-gradient(160deg,#0f1a08,#1c2e0a);border-bottom:3px solid #7a9e2a;padding:14px 16px 0;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;max-width:960px;margin-left:auto;margin-right:auto;}
.logo{width:44px;height:44px;background:linear-gradient(135deg,#3a5c0a,#7a9e2a);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#d4e89a;flex-shrink:0;}
.ttl{font-size:clamp(15px,4vw,22px);font-weight:900;color:#c8d870;}
.sub{font-size:9px;color:#5a7a1a;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.sem-nav{display:flex;gap:5px;align-items:center;margin-left:auto;}
.sem-lbl{font-size:10px;color:#7a9e2a;font-weight:700;}
.nbtn{padding:4px 8px;background:rgba(122,158,42,0.08);border:1px solid rgba(122,158,42,0.2);border-radius:6px;color:#5a7a1a;font-size:11px;font-weight:700;cursor:pointer;font-family:system-ui;}
.nbtn.hoy{border-color:rgba(200,168,75,0.3);color:#c8a84b;background:rgba(200,168,75,0.08);}
.tabs{display:flex;max-width:960px;margin:0 auto;}
.tab{flex:1;padding:9px 4px;border:none;background:transparent;font-family:system-ui;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:#3a5c0a;border-bottom:3px solid transparent;}
.tab.on{color:#c8d870;border-bottom:3px solid #7a9e2a;background:rgba(122,158,42,0.08);}
.wrap{max-width:960px;margin:0 auto;padding:16px 12px 80px;}
.sec{font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#7a9e2a;margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(122,158,42,0.4),transparent);}
.dias{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.dbtn{flex-shrink:0;padding:7px 12px;border:2px solid rgba(122,158,42,0.2);border-radius:16px;background:transparent;font-family:system-ui;font-size:11px;font-weight:800;cursor:pointer;color:#3a5c0a;}
.dbtn.on{background:linear-gradient(135deg,#3a5c0a,#7a9e2a);border-color:#7a9e2a;color:#fff;}
.card{border-radius:7px;margin-bottom:5px;overflow:hidden;border:1px solid;}
.chead{padding:5px 10px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.35);}
.cname{font-size:12px;font-weight:900;}
.csub{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:0.55;margin-top:2px;}
.cbody{padding:6px 10px;}
.ttag{display:inline-block;padding:2px 7px;border-radius:9px;font-size:8px;font-weight:900;letter-spacing:1px;margin-bottom:7px;}
.org{background:rgba(74,222,128,0.1);color:#4ade80;border:1px solid rgba(74,222,128,0.25);}
.conv{background:rgba(200,168,75,0.1);color:#c8a84b;border:1px solid rgba(200,168,75,0.25);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.f label{display:block;font-size:8px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#5a7a1a;margin-bottom:4px;}
.inp{width:100%;border:1px solid rgba(122,158,42,0.2);border-radius:5px;padding:4px 6px;font-family:system-ui;font-size:13px;font-weight:800;background:rgba(0,0,0,0.35);color:#e8e0c8;outline:none;text-align:center;}
.inp:focus{border-color:#7a9e2a;}
.inp::placeholder{color:rgba(255,255,255,0.1);font-weight:400;font-size:11px;}
.inp.pct{color:#c8d870;} .inp.kg{color:#86c87a;} .inp.bts{color:#c8a84b;} .inp.pzs{color:#7ab8d8;}
.ssec{font-size:8px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#5a7a1a;margin:4px 0 2px;padding-bottom:2px;border-bottom:1px solid rgba(122,158,42,0.12);}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.mbox{border-radius:9px;overflow:hidden;margin-bottom:8px;}
.cpbtn{padding:9px 16px;border:2px solid rgba(122,158,42,0.35);border-radius:9px;background:rgba(122,158,42,0.08);color:#c8d870;font-family:system-ui;font-size:11px;font-weight:800;cursor:pointer;margin-right:8px;margin-bottom:10px;}
.cpbtn.amb{border-color:rgba(200,168,75,0.35);color:#c8a84b;background:rgba(200,168,75,0.08);}
/* Balance chips */
.chip{border-radius:9px;padding:9px 10px;border:1px solid;text-align:center;min-width:80px;}
.chip-l{font-size:7px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
.chip-v{font-size:18px;font-weight:900;font-family:Georgia,serif;}
.rrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
/* Cruce */
.cruce{background:rgba(0,0,0,0.2);border-radius:9px;padding:10px 12px;margin-top:8px;border:1px solid rgba(122,158,42,0.2);}
.cruce-l{font-size:8px;color:#5a7a1a;font-weight:900;letter-spacing:1.5px;margin-bottom:7px;}
.cruce-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;}
.cruce-cell{border-radius:7px;padding:6px 4px;}
.cruce-cl{font-size:7px;font-weight:900;margin-bottom:2px;}
.cruce-cv{font-size:16px;font-weight:900;font-family:Georgia,serif;}
/* Modal */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#0c0f07;border:2px solid;border-radius:13px;padding:22px;max-width:350px;width:100%;}
.mbtn{padding:10px;border-radius:8px;font-family:system-ui;font-size:12px;font-weight:900;cursor:pointer;}
/* Bal filter */
.frow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.fbtn{padding:5px 10px;border:2px solid rgba(122,158,42,0.2);border-radius:7px;background:transparent;color:#5a7a1a;font-family:system-ui;font-size:10px;font-weight:800;cursor:pointer;}
.fbtn.on{background:rgba(122,158,42,0.15);border-color:#7a9e2a;color:#c8d870;}
/* Bal block */
.bblk{border-radius:12px;padding:13px;margin-bottom:10px;border:2px solid rgba(122,158,42,0.18);background:rgba(122,158,42,0.04);}
@media(max-width:600px){.g4{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr 1fr;}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var uS=React.useState;
var uE=React.useEffect;
var FB_C="https://parrasvalley-default-rtdb.firebaseio.com/campo-proyeccion-v1.json";
var FB_INV="https://parrasvalley-default-rtdb.firebaseio.com/produccion-v1.json";
var FB_S="https://parrasvalley-default-rtdb.firebaseio.com/campo-proy-semanas-v1.json";
var FB_PED="https://parrasvalley-default-rtdb.firebaseio.com/campo-proy-semanas-v1";
var FB_A="https://parrasvalley-default-rtdb.firebaseio.com/campo-proy-ajustes-v1.json";

var LS="emp-v3";
var RANCHOS=["pvt","crp","f4h"];
var RPRODS={pvt:["Persa","Slicer"],crp:["Europeo","Persa","Slicer","Morron","Minibel"],f4h:["Persa","Morron","Minibel"]};
var DIAS=["Viernes","Sabado","Domingo","Lunes","Martes","Miercoles","Jueves"];
var DIAS_C=["Viernes","Sabado","Domingo","Lunes","Martes","Miercoles","Jueves"];
var TIPOS=["org","conv"];
var CM=[{id:"rojo",l:"Rojo",c:"#ef4444"},{id:"amarillo",l:"Amarillo",c:"#eab308"},{id:"naranja",l:"Naranja",c:"#f97316"},{id:"verde",l:"Verde",c:"#22c55e"}];
var PP=[{id:"p20",l:"20 lb",kg:9.25},{id:"p8x2",l:"8x2",kg:7.60},{id:"p12x1",l:"12x1",kg:5.70}];
var PM=[{id:"m12x1lb",l:"12x1lb",kg:5.76},{id:"m12x8oz",l:"12x8oz",kg:2.88},{id:"m18lb",l:"18lb",kg:8.3}];
var GRN="#86c87a"; var AMB="#c8a84b";
var KG_PRES={"20lb":9.25,"20 lb":9.25,"8x2":7.60,"12x1":5.70,"12x1lb":5.76,"12x8oz":2.88,"18lb":8.3,"18 lb":8.3,"25lb":11.34,"50lb":22.68,"RPC 35lb":15.87,"1/9 bushel":9.07,"12ct":9.07,"24ct":4.54,"Bushel":27.0};
function nv(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function pct(v){return nv(v)/100;}
function fmt(v,d){d=d===undefined?1:d;if(!isFinite(v)||isNaN(v)||v===0)return "--";return v.toLocaleString("es-MX",{minimumFractionDigits:d,maximumFractionDigits:d});}
function fk(v){return fmt(v,1)+" kg";}
function lsL(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getSem(){var d=new Date();var dia=d.getDay();var diff=dia>=5?dia-5:dia+2;var ini=new Date(d);ini.setDate(d.getDate()-diff);return ini.toISOString().split("T")[0];}
function addDias(f,n){var d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().split("T")[0];}
function numSem(f){var d=new Date(f+"T12:00:00");var dia=d.getDay();var ini=new Date(d);ini.setDate(d.getDate()-((dia+3)%7));ini.setHours(0,0,0,0);var ft=new Date(ini.getFullYear(),0,4);return Math.ceil(((ini-ft)/(86400000*7)))+1;}
function labelSem(f){var d=new Date(f+"T12:00:00");var fin=new Date(d);fin.setDate(d.getDate()+6);var m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return "Sem "+numSem(f)+" . "+d.getDate()+" "+m[d.getMonth()]+" al "+fin.getDate()+" "+m[fin.getMonth()];}
function initF(){var f={Persa:{fpri:"",fseg:"",fpri_c:"",fseg_c:""},Minibel:{kgr:"7.35",kgr_c:"7.35"},Europeo:{pzs:"",kg:"",pp:"",ps:"",pc:"",pzs_c:"",kg_c:"",pp_c:"",ps_c:"",pc_c:""},Slicer:{pzs:"",kg:"",pp:"",ps:"",pt:"",pzs_c:"",kg_c:"",pp_c:"",ps_c:"",pt_c:""},Morron:{}};CM.forEach(function(c){TIPOS.forEach(function(t){f.Morron[c.id+"_"+t]={kg:"",ppri:"",pseg:"",pter:"",pl:"",pxl:"",pj:""};});});return f;}
function initP(){return{Persa:{},Minibel:{},Europeo:{},Slicer:{},Morron:{}};}
function initSem(){var s={fac:[],ped:[],campo:{}};for(var i=0;i<7;i++){s.fac.push(initF());s.ped.push(initP());}return s;}
function App(){
  var t1=uS("campo"); var tab=t1[0]; var setTab=t1[1];
  var t2=uS(0); var di=t2[0]; var setDi=t2[1];
  var t3=uS(function(){return lsL(LS,initSem());}); var sem=t3[0]; var setSem=t3[1];
  var t4=uS(getSem()); var semSel=t4[0]; var setSemSel=t4[1];
  var t5=uS({}); var sg=t5[0]; var setSg=t5[1];
  var t6=uS({}); var aju=t6[0]; var setAju=t6[1];
  var t8=uS(false); var jalC=t8[0]; var setJalC=t8[1];
  var t10=uS(false); var mC=t10[0]; var setMC=t10[1];
  var t12=uS(DIAS_C[0]); var dJC=t12[0]; var setDJC=t12[1];
  var t14=uS("todos"); var bfD=t14[0]; var setBfD=t14[1];
  var t15=uS("todos"); var bfP=t15[0]; var setBfP=t15[1];
  var t16=uS(false); var jOk=t16[0]; var setJOk=t16[1];
  var t17=uS({}); var invReal=t17[0]; var setInvReal=t17[1];
  var t18=uS(false); var jalInv=t18[0]; var setJalInv=t18[1];
  var t19=uS(false); var jalProg=t19[0]; var setJalProg=t19[1];
  var t20=uS(false); var showInvModal=t20[0]; var setShowInvModal=t20[1];
  var t21=uS("todo"); var invFiltro=t21[0]; var setInvFiltro=t21[1];
  var t22=uS((function(){var d=new Date(),m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;})()); var invFecha=t22[0]; var setInvFecha=t22[1];

  // Semana ISO del dia seleccionado
  function getWeekNum(dt){
    var d=dt?new Date(dt):new Date();
    d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);
    var w=new Date(d.getFullYear(),0,4);
    return 1+Math.round(((d.getTime()-w.getTime())/86400000-3+(w.getDay()+6)%7)/7);
  }

  // Mapas de traduccion programa -> pedidos
  var PROG_FRUTA={
    "PERSA":["Persa","conv"],"PERSA OG":["Persa","org"],
    "EURO":["Europeo","conv"],"EUROPEO":["Europeo","conv"],"EURO ORG":["Europeo","org"],"EURO OG":["Europeo","org"],
    "BELL OG":["Europeo","org"],
    "MINI BELL":["Minibel","conv"],"MINI BELL OG":["Minibel","org"],"MINIBEL":["Minibel","conv"],
    "SLICER":["Slicer","conv"],"SLICER OG":["Slicer","org"],
    "MORRON":["Morron","conv"],"MORRON2":["Morron","conv"]
  };
  var PROG_PRES={
    // Persa
    "20 LBS":"p20","20LBS":"p20","20 LB":"p20","20LB":"p20","20 LBS XF":"p20",
    "12X1 LB CV":"p12x1","12X1LB CV":"p12x1","12X1 LB ORG":"p12x1","12X1 LB RPC":"p12x1",
    "12X8OZ":"p8x2","12X8 OZ":"p8x2",
    // Minibel
    "12X1 LB":"m12x1lb","12X8OZ":"m12x8oz","18LBS":"m18lb","18 LBS":"m18lb",
    // Slicer piezas
    "18CT":"18pz","18 CT":"18pz","24CT":"24pz","24 CT":"24pz",
    "36CT":"36pz","36CT OG":"36pz","36 CT":"36pz",
    "62CT":"62pz","62 CT":"62pz","175 PZS XF":"62pz",
    // Slicer peso
    "25LB":"25lb","25 LBS":"25lb","42 LBS SLICER MERMA":"50lb","50LB":"50lb","50 LBS":"50lb",
    // Europeo
    "12CT":"24pz","12 CT":"24pz"
  };

  function jalarPrograma(){
    var wk=getWeekNum(semSel);
    setJalProg(true);
    fetch("https://parrasvalley-default-rtdb.firebaseio.com/programa-semanal-v1/S"+wk+".json")
      .then(function(r){return r.json();})
      .then(function(data){
        if(!data||!data.rows){setJalProg(false);alert("Sin programa para la semana "+wk);return;}
        var diaActual=DIAS[di];
        var filas=data.rows.filter(function(r){return r.dia&&r.dia.toLowerCase()===diaActual.toLowerCase();});
        if(!filas.length){setJalProg(false);alert("Sin lineas para "+diaActual+" en la semana "+wk);return;}
        var ns=JSON.parse(JSON.stringify(sem));
        var aplicadas=0;var omitidas=[];
        filas.forEach(function(fila){
          var fruKey=(fila.fruta||"").toUpperCase().trim();
          var presKey=(fila.presentacion||"").toUpperCase().trim();
          var mf=PROG_FRUTA[fruKey];
          if(!mf){omitidas.push(fila.fruta+" (fruta no reconocida)");return;}
          var prod=mf[0],tipo=mf[1];
          var caj=parseInt(fila.cajas)||0;if(!caj)return;
          if(!ns.ped[di])ns.ped[di]={};
          if(!ns.ped[di][prod])ns.ped[di][prod]={};
          if(!ns.ped[di][prod][tipo])ns.ped[di][prod][tipo]={};
          var b=ns.ped[di][prod][tipo];
          var mp=PROG_PRES[presKey];
          var cal=(fila.calidad||"#1")==="#1"?"pri":"seg";
          if(prod==="Persa"||prod==="Minibel"){
            if(prod==="Persa"&&mp&&(mp==="p20"||mp==="p12x1"||mp==="p8x2")){
              if(!b[cal])b[cal]={};b[cal][mp]=(parseInt(b[cal][mp])||0)+caj;
            } else if(prod==="Minibel"&&mp){
              b[mp]=(parseInt(b[mp])||0)+caj;
            } else {omitidas.push(fila.presentacion+" (presentacion Persa/Minibel no reconocida)");return;}
          } else if(prod==="Slicer"){
            if(mp&&(mp.endsWith("pz"))){if(!b.pz)b.pz={};b.pz[mp]=(parseInt(b.pz[mp])||0)+caj;}
            else if(mp&&(mp.endsWith("lb"))){if(!b.kg)b.kg={};b.kg[mp]=(parseInt(b.kg[mp])||0)+caj;}
            else{omitidas.push(fila.presentacion+" (presentacion Slicer no reconocida)");return;}
          } else if(prod==="Europeo"){
            if(mp&&mp.endsWith("pz")){b.pp=(parseInt(b.pp)||0)+caj;}
            else{b.pri=(parseInt(b.pri)||0)+caj;}
          } else if(prod==="Morron"){
            if(!b.rojo)b.rojo={};b.rojo.L=(parseInt(b.rojo.L)||0)+caj;
          }
          aplicadas++;
        });
        save(ns);
        setJalProg(false);
        var msg2="OK Semana "+wk+" - "+diaActual+": "+aplicadas+" linea(s) aplicadas.";
        if(omitidas.length)msg2+="\nOmitidas: "+omitidas.join("; ");
        alert(msg2);
      }).catch(function(){setJalProg(false);alert("Error al conectar con el programa semanal");});
  }
  var sI=semSel;
  function save(ns){setSem(ns);lsS(LS,ns);}
  function setFac(i,prod,campo,val){var ns=JSON.parse(JSON.stringify(sem));if(ns.fac[i]&&ns.fac[i][prod])ns.fac[i][prod][campo]=val;save(ns);}
  function setFM(i,cId,tipo,campo,val){var ns=JSON.parse(JSON.stringify(sem));var k=cId+"_"+tipo;if(ns.fac[i]&&ns.fac[i].Morron&&ns.fac[i].Morron[k])ns.fac[i].Morron[k][campo]=val;save(ns);}
  function setPed(i,prod,path,val){var ns=JSON.parse(JSON.stringify(sem));if(!ns.ped[i])ns.ped[i]=initP();if(!ns.ped[i][prod])ns.ped[i][prod]={};var ref=ns.ped[i][prod];var parts=path.split(".");for(var x=0;x<parts.length-1;x++){if(!ref[parts[x]])ref[parts[x]]={};ref=ref[parts[x]];}ref[parts[parts.length-1]]=val;save(ns);}
  function jalarCampo(diaLbl){
    setJalC(true);setMC(false);
    fetch(FB_C).then(function(r){return r.json();}).then(function(d){
      var keys=d?Object.keys(d):[];
      alert("Campo Firebase: "+keys.length+" claves. Ej: "+(keys[0]||"ninguna")+" / dia buscado: "+diaLbl);
      var ci=DIAS_C.indexOf(diaLbl);
      var ns=JSON.parse(JSON.stringify(sem));
      if(d&&typeof d==="object"){
        var allDays=diaLbl==="todos";
        Object.keys(d).forEach(function(k){var pts=k.split("|");if(pts.length===3&&(allDays||parseInt(pts[2])===ci))ns.campo[k]=d[k];});
      }
      save(ns);
      fetch(FB_S).then(function(r2){return r2.json();}).then(function(ds){
        if(ds&&typeof ds==="object")setSg(ds);
        fetch(FB_A).then(function(r3){return r3.json();}).then(function(da){
          if(da&&typeof da==="object")setAju(da);
          setJalC(false);setJOk(true);setTimeout(function(){setJOk(false);},3000);
        }).catch(function(){setJalC(false);});
      }).catch(function(){setJalC(false);});
    }).catch(function(e){setJalC(false);alert("Error fetch campo: "+e.message);});
  }
  var mapC=[0,1,2,3,4,5,6];
  function getRejRancho(rid,prod,diaI,tipo){
    if((RPRODS[rid]||[]).indexOf(prod)<0)return 0;
    var cl=sI+"_"+rid+"_"+diaI+"_"+prod+"_"+tipo;
    if(aju&&aju[cl])return nv(aju[cl].rejas);
    var s2=sg&&sg[sI+"_"+rid];
    if(s2&&s2.dias&&s2.dias[diaI]){
      var dx=s2.dias[diaI];
      var v=nv(dx[prod]&&dx[prod][tipo]&&dx[prod][tipo].rejas||0);
      if(v>0)return v;
    }
    var ci=mapC[diaI];var k=sI+"|"+rid+"|"+ci;var dxc=sem.campo[k];
    if(dxc&&dxc[prod])return nv(dxc[prod][tipo]&&dxc[prod][tipo].rejas||0);
    return 0;
  }
  function getRej(prod,diaI,tipo){
    var totalA=0;var tA=false;
    RANCHOS.forEach(function(rid){if((RPRODS[rid]||[]).indexOf(prod)<0)return;var cl=sI+"_"+rid+"_"+diaI+"_"+prod+"_"+tipo;if(aju&&aju[cl]){tA=true;totalA+=nv(aju[cl].rejas);}});
    if(tA)return totalA;
    var totalS=0;var tS=false;
    RANCHOS.forEach(function(rid){if((RPRODS[rid]||[]).indexOf(prod)<0)return;var s2=sg&&sg[sI+"_"+rid];if(s2&&s2.dias&&s2.dias[diaI]){var dx=s2.dias[diaI];var v=nv(dx[prod]&&dx[prod][tipo]&&dx[prod][tipo].rejas||0);if(v>0){tS=true;totalS+=v;}}});
    if(tS)return totalS;
    var total=0;var ci=mapC[diaI];
    RANCHOS.forEach(function(rid){if((RPRODS[rid]||[]).indexOf(prod)<0)return;var k=sI+"|"+rid+"|"+ci;var dx=sem.campo[k];if(!dx||!dx[prod])return;total+=nv(dx[prod][tipo]&&dx[prod][tipo].rejas||0);});
    return total;
  }
  function getRejM(cId,diaI,tipo){
    var total=0;var ci=mapC[diaI];
    RANCHOS.forEach(function(rid){if((RPRODS[rid]||[]).indexOf("Morron")<0)return;var k=sI+"|"+rid+"|"+ci;var dx=sem.campo[k];if(!dx||!dx.Morron)return;var cols=(dx.Morron[tipo]&&dx.Morron[tipo].colores)||[];var ca=cols.find(function(c){return c.id===cId;});if(ca)total+=nv(ca.rejas);});
    return total;
  }
  function calcD(diaI){
    var f=sem.fac[diaI]||initF(); var res={};
    var fp=f.Persa||{}; res.Persa={};
    TIPOS.forEach(function(t){var s=t==="org"?"":"_c";var rj=getRej("Persa",diaI,t);res.Persa[t]={rj:rj,bP:rj*nv(fp["fpri"+s]),bS:rj*nv(fp["fseg"+s]),kP:rj*nv(fp["fpri"+s])*9.25,kS:rj*nv(fp["fseg"+s])*9.25};});
    var fm2=f.Minibel||{}; res.Minibel={};
    TIPOS.forEach(function(t){var s=t==="org"?"":"_c";var rj=getRej("Minibel",diaI,t);var kP=rj*nv(fm2["kgr"+s]);res.Minibel[t]={rj:rj,kP:kP};});
    var fe=f.Europeo||{}; res.Europeo={};
    TIPOS.forEach(function(t){var s=t==="org"?"":"_c";var rj=getRej("Europeo",diaI,t);var pz=rj*nv(fe["pzs"+s]);var kg=rj*nv(fe["kg"+s]);res.Europeo[t]={rj:rj,pzT:pz,kgT:kg,pzP:pz*pct(fe["pp"+s]),kgP:kg*pct(fe["pp"+s]),pzS:pz*pct(fe["ps"+s]),kgS:kg*pct(fe["ps"+s]),pzC:pz*pct(fe["pc"+s]),kgC:kg*pct(fe["pc"+s])};});
    var fs=f.Slicer||{}; res.Slicer={};
    TIPOS.forEach(function(t){var s=t==="org"?"":"_c";var rj=getRej("Slicer",diaI,t);var pz=rj*nv(fs["pzs"+s]);var kg=rj*nv(fs["kg"+s]);res.Slicer[t]={rj:rj,pzT:pz,kgT:kg,pzP:pz*pct(fs["pp"+s]),kgP:kg*pct(fs["pp"+s]),pzS:pz*pct(fs["ps"+s]),kgS:kg*pct(fs["ps"+s]),pzTer:pz*pct(fs["pt"+s]),kgTer:kg*pct(fs["pt"+s])};});
    res.Morron={};
    CM.forEach(function(col){res.Morron[col.id]={};TIPOS.forEach(function(t){var fm=(f.Morron&&f.Morron[col.id+"_"+t])||{};var rj=getRejM(col.id,diaI,t);var kT=rj*nv(fm.kg);var kP=kT*pct(fm.ppri);res.Morron[col.id][t]={rj:rj,kT:kT,kP:kP,kS:kT*pct(fm.pseg),kTer:kT*pct(fm.pter),kL:kP*pct(fm.pl),kXL:kP*pct(fm.pxl),kJ:kP*pct(fm.pj)};});});
    return res;
  }

    function ac(prod){var r={};TIPOS.forEach(function(t){r[t]={};var c0=calcD(0)[prod][t];Object.keys(c0).forEach(function(k){r[t][k]=dias.reduce(function(s,dI){return s+(calcD(dI)[prod][t][k]||0);},0);});});return r;}
    function acM(cId){var r={};TIPOS.forEach(function(t){r[t]={};var c0=calcD(0).Morron[cId][t];Object.keys(c0).forEach(function(k){r[t][k]=dias.reduce(function(s,dI){return s+(calcD(dI).Morron[cId][t][k]||0);},0);});});return r;}
    return{P:ac("Persa"),Mb:ac("Minibel"),E:ac("Europeo"),S:ac("Slicer"),M:CM.reduce(function(o,col){o[col.id]=acM(col.id);return o;},{})};
  }
  function getPed(diaI,prod,path){
    var base=(sem.ped[diaI]&&sem.ped[diaI][prod])||{};
    var parts=path.split(".");var ref=base;
    for(var i=0;i<parts.length;i++){ref=ref&&ref[parts[i]];}
    return nv(ref||0);
  }

      var flat={};var idx=0;
      Object.keys(d).forEach(function(prod){
        var po=d[prod];if(!po)return;
        ta(po.inventario).forEach(function(r){

          flat[idx++]=r;

      var filtroDesc=invFiltro==="todo"?"todo el inventario":"fecha "+invFecha;
      alert("Cuarto frio ("+filtroDesc+"): "+total+" pallets, "+Math.round(kgTotal)+" kg totales");

          <div className="card" style={{background:"#f8717106",borderColor:"#f8717130"}}>
            <div className="chead"><div className="cname" style={{color:"#f87171"}}>Morron</div></div>
            <div className="cbody">
              {CM.map(function(col){var base=(sem.ped[di].Morron&&sem.ped[di].Morron[col.id])||{};return(
                <div key={col.id} style={{marginBottom:6}}>
                  <div style={{fontSize:9,fontWeight:900,color:col.c,marginBottom:3}}>{col.l}</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:3}}>
                    <FI label="L" cls="kg" val={base.L||""} set={function(v){setPed(di,"Morron",col.id+".L",v);}} mb={2}/>
                    <FI label="XL" cls="kg" val={base.XL||""} set={function(v){setPed(di,"Morron",col.id+".XL",v);}} mb={2}/>
                    <FI label="Jumbo" cls="kg" val={base.Jumbo||""} set={function(v){setPed(di,"Morron",col.id+".Jumbo",v);}} mb={2}/>
                    <FI label="Choice" cls="bts" val={base.cho||""} set={function(v){setPed(di,"Morron",col.id+".cho",v);}} mb={2}/>
                  </div>
                </div>);
              })}
            </div>
          </div>
        </div>
      )}
      {tab==="factores"&&(
        <div className="body">
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <div className="sec" style={{marginBottom:0}}>Factores - {DIAS[di]}</div>
            <button onClick={copyFacSig} style={{fontSize:10,padding:"4px 10px",background:"rgba(122,158,42,0.1)",border:"1px solid rgba(122,158,42,0.3)",borderRadius:6,color:"#7a9e2a",cursor:"pointer"}}>Copiar al sig dia</button>
            <button onClick={copyFacSem} style={{fontSize:10,padding:"4px 10px",background:"rgba(122,158,42,0.1)",border:"1px solid rgba(122,158,42,0.3)",borderRadius:6,color:"#7a9e2a",cursor:"pointer"}}>Copiar a semana</button>
          </div>
          {["Persa","Minibel","Europeo","Slicer"].map(function(prod){var fp=sem.fac[di][prod]||{};var col=prod==="Persa"?GRN:prod==="Minibel"?"#e07070":prod==="Europeo"?"#5ab88a":"#a8c840";return(
            <div key={prod} className="card" style={{background:col+"06",borderColor:col+"30"}}>
              <div className="chead"><div className="cname" style={{color:col}}>{prod}</div></div>
              <div className="cbody">
                {TIPOS.map(function(t){var s2=t==="org"?"":"_c";return(<TBlq key={t} t={t}>
                  {prod==="Persa"&&<div className="g2"><FI label="Fpri kg/reja" cls="kg" val={fp["fpri"+s2]||""} set={function(v){setFac(di,prod,"fpri"+s2,v);}}/><FI label="Fseg kg/reja" cls="kg" val={fp["fseg"+s2]||""} set={function(v){setFac(di,prod,"fseg"+s2,v);}}/></div>}
                  {prod==="Minibel"&&<FI label="kg/reja" cls="kg" val={fp["kgr"+s2]||""} set={function(v){setFac(di,prod,"kgr"+s2,v);}}/>}
                  {(prod==="Europeo"||prod==="Slicer")&&<div className="g2">
                    <FI label="pzs/reja" cls="pzs" val={fp["pzs"+s2]||""} set={function(v){setFac(di,prod,"pzs"+s2,v);}} step="1"/>
                    <FI label="kg/reja" cls="kg" val={fp["kg"+s2]||""} set={function(v){setFac(di,prod,"kg"+s2,v);}}/>
                    <FI label="% 1a" cls="pct" val={fp["pp"+s2]||""} set={function(v){setFac(di,prod,"pp"+s2,v);}}/>
                    <FI label="% 2a" cls="pct" val={fp["ps"+s2]||""} set={function(v){setFac(di,prod,"ps"+s2,v);}}/>
                    {prod==="Slicer"&&<FI label="% merma" cls="pct" val={fp["pt"+s2]||""} set={function(v){setFac(di,prod,"pt"+s2,v);}}/>}
                    {prod==="Europeo"&&<FI label="% choice" cls="pct" val={fp["pc"+s2]||""} set={function(v){setFac(di,prod,"pc"+s2,v);}}/>}
                  </div>}
                </TBlq>);})}
              </div>
            </div>);
          })}
          <div className="card" style={{background:"#f8717106",borderColor:"#f8717130"}}>
            <div className="chead"><div className="cname" style={{color:"#f87171"}}>Morron</div></div>
            <div className="cbody">
              {CM.map(function(col){return(<div key={col.id} style={{marginBottom:12}}>{TIPOS.map(function(t){var k=col.id+"_"+t;var fm=(sem.fac[di].Morron&&sem.fac[di].Morron[k])||{};var ec=t==="org"?"#4ade80":"#60a5fa";return(<div key={t}><div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",background:col.c+"10",border:"2px solid "+col.c+"33",borderRadius:"9px 9px 0 0",borderBottom:"none"}}><div className="dot" style={{background:col.c}}/><span style={{fontSize:13,fontWeight:900,color:col.c}}>{col.l}</span><span className={"ttag "+t} style={{marginBottom:0}}>{t==="org"?"ORG":"CONV"}</span></div><div style={{background:col.c+"06",border:"2px solid "+col.c+"33",borderTop:"none",borderRadius:"0 0 9px 9px",padding:"11px 12px",marginBottom:6}}><FI label="Kg/reja" cls="kg" val={fm.kg||""} set={function(v){setFM(di,col.id,t,"kg",v);}}/><div className="ssec">% DEL TOTAL</div><div className="g3"><FI label="% 1a" cls="pct" val={fm.ppri||""} set={function(v){setFM(di,col.id,t,"ppri",v);}} mb={0}/><FI label="% 2a" cls="pct" val={fm.pseg||""} set={function(v){setFM(di,col.id,t,"pseg",v);}} mb={0}/><FI label="% 3a" cls="pct" val={fm.pter||""} set={function(v){setFM(di,col.id,t,"pter",v);}} mb={0}/></div><div className="ssec" style={{marginTop:8}}>DENTRO DE 1a</div><div className="g3"><FI label="% L" cls="pct" val={fm.pl||""} set={function(v){setFM(di,col.id,t,"pl",v);}} mb={0}/><FI label="% XL" cls="pct" val={fm.pxl||""} set={function(v){setFM(di,col.id,t,"pxl",v);}} mb={0}/><FI label="% Jumbo" cls="pct" val={fm.pj||""} set={function(v){setFM(di,col.id,t,"pj",v);}} mb={0}/></div></div></div>);})}</div>);})}
            </div>
          </div>
        </div>
      )}
      {tab==="balance"&&(
        <div className="body">
          <div className="sec">Balance - {DIAS[di]}</div>
          {(function(){
            var config=[
              {prod:"Persa",col:GRN,cals:["Primera","Segunda"],
                kProy:function(t,c){var d=calcD(di).Persa[t];return c==="Primera"?d.kP:d.kS;},
                kPed:function(t,c){return PP.reduce(function(s,p){var path=c==="Primera"?"pri."+p.id:"seg."+p.id;return s+getPed(di,"Persa",t+"."+path)*p.kg;},0);}},
              {prod:"Minibel",col:"#e07070",cals:["Primera"],
                kProy:function(t){return calcD(di).Minibel[t].kP;},
                kPed:function(t){return PM.reduce(function(s,p){return s+getPed(di,"Minibel",t+"."+p.id)*p.kg;},0);}},
              {prod:"Slicer",col:"#a8c840",cals:["Primera","Selecto"],
                kProy:function(t,c){var d=calcD(di).Slicer[t];return c==="Primera"?d.kgP:d.kgS;},
                kPed:function(t,c){var k=c==="Primera"?"kg":"seg_kg";return getPed(di,"Slicer",t+"."+k+".25lb")*11.34+getPed(di,"Slicer",t+"."+k+".50lb")*22.68;}},
              {prod:"Europeo",col:"#5ab88a",cals:["Primera","Segunda","Tercera"],
                kProy:function(t,c){var d=calcD(di).Europeo[t];return c==="Primera"?d.kgP:c==="Segunda"?d.kgS:d.kgC;},
                kPed:function(t,c){if(c==="Primera")return(getPed(di,"Europeo",t+".p24")*24)+(getPed(di,"Europeo",t+".p12")*12);if(c==="Segunda")return(getPed(di,"Europeo",t+".s24")*24)+(getPed(di,"Europeo",t+".s12")*12);return getPed(di,"Europeo",t+".cho")*48;}},
            ];
            var filas=[];
            config.forEach(function(cfg){
              if(!show(cfg.prod))return;
              TIPOS.forEach(function(t){
                cfg.cals.forEach(function(cal){
                  var kProy=cfg.kProy(t,cal)||0;
                  var kPed=cfg.kPed(t,cal)||0;
                  var kInv=0;
                  Object.values(invReal).forEach(function(r){
                    var orgOk=t==="org"?r.organico===true:r.organico!==true;
                    if(r.producto===cfg.prod&&r.calidad===cal&&orgOk)kInv+=(parseInt(r.cajas)||0)*(KG_PRES[r.presentacion]||0);
                  });
                  var kTotal=kProy+kInv;
                  var exc=kTotal-kPed;
                  if(kInv===0&&kProy===0&&kPed===0)return;
                  filas.push({prod:cfg.prod,cal:cal,tipo:t,col:cfg.col,kProy:kProy,kInv:kInv,kTotal:kTotal,kPed:kPed,exc:exc});
                });
              });
            });
            if(!filas.length)return(<div style={{textAlign:"center",padding:30,color:"#3a5c0a",fontSize:13}}>Sin datos. Carga campo, factores o pedidos.</div>);
            return(
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead><tr>{["Producto","Calidad","Tipo","Campo","Cuarto","+Total","Pedido","Balance"].map(function(h){return(<th key={h} style={{padding:"6px 8px",background:"rgba(122,158,42,0.1)",color:"#7a9e2a",fontWeight:700,textAlign:"right",borderBottom:"1px solid rgba(122,158,42,0.2)"}}>{h}</th>);})}</tr></thead>
                <tbody>
                  {filas.map(function(f,i){return(
                    <tr key={i} style={{background:i%2===0?"transparent":"rgba(255,255,255,0.02)"}}>
                      <td style={{padding:"5px 8px",color:f.col,fontWeight:700}}>{f.prod}</td>
                      <td style={{padding:"5px 8px",color:"#a0a0a0"}}>{f.cal}</td>
                      <td style={{padding:"5px 8px",color:f.tipo==="org"?"#4ade80":"#fbbf24"}}>{f.tipo==="org"?"Org":"Conv"}</td>
                      <td style={{padding:"5px 8px",color:AMB,fontFamily:"monospace",textAlign:"right"}}>{f.kProy>0?fk(f.kProy):"--"}</td>
                      <td style={{padding:"5px 8px",color:"#5ab88a",fontFamily:"monospace",textAlign:"right"}}>{f.kInv>0?fk(f.kInv):"--"}</td>
                      <td style={{padding:"5px 8px",color:"#f0ede8",fontFamily:"monospace",fontWeight:700,textAlign:"right"}}>{fk(f.kTotal)}</td>
                      <td style={{padding:"5px 8px",color:"#fde047",fontFamily:"monospace",textAlign:"right"}}>{f.kPed>0?fk(f.kPed):"--"}</td>
                      <td style={{padding:"5px 8px",fontFamily:"monospace",fontWeight:900,textAlign:"right",color:f.exc>=0?"#4ade80":"#ef4444"}}>{f.exc>=0?"+"+fk(f.exc):"-"+fk(Math.abs(f.exc))}</td>
                    </tr>
                  );})}
                </tbody>
              </table>
            );
          })()}
          <div style={{marginTop:14,background:"rgba(122,158,42,0.05)",border:"1px solid rgba(122,158,42,0.15)",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:9,color:"#5a7a1a",fontWeight:900,letterSpacing:1.5,marginBottom:6}}>FILTRO</div>
            <div className="frow">{[["todos","Todos"]].concat(["Persa","Europeo","Slicer","Morron","Minibel"].map(function(p){return[p,p];})).map(function(item){return(<button key={item[0]} className={"fbtn "+(bfP===item[0]?"on":"")} onClick={function(){setBfP(item[0]);}}>{item[1]}</button>);})}</div>
          </div>
        </div>
      )}
      {tab==="total"&&<div className="body"><div style={{color:"#86c87a",padding:20,fontSize:14}}>Disponible - {DIAS[di]}<div style={{fontSize:11,color:"#4a6a3a",marginTop:8}}>Proximamente</div></div></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
window.addEventListener('error',function(e){alert('ERROR: '+e.message+'\nLinea: '+e.lineno+'\nArchivo: '+(e.filename||'').split('/').pop());},true);
</script>
</body>
</html>
