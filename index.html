      res.Slicer[t]={rj:rj,pzT:pzT,kgT:kgT,kgP:kgP,kgS:kgS,kgTer:kgTer};

                {cal:"Segunda",proy:sP(function(d){return(calcD(d).Persa.org.kS||0)+(calcD(d).Persa.conv.kS||0);}),
                  ped:sP(function(d){return getPedLista(d).filter(function(p){return p.fruta==="Persa"&&p.cal==="Segunda";}).reduce(function(s,p){return s+(p.cajas||0)*kgCajaD(p.pres,"Persa",null,p.org?"org":"conv",d);},0);})}
              ]},
              {prod:"Slicer",col:"#a8c840",items:[
                {cal:"Super",proy:sP(function(d){return(calcD(d).Slicer.org.kgP||0)+(calcD(d).Slicer.conv.kgP||0);}),
                  ped:sP(function(d){return getPedLista(d).filter(function(p){return p.fruta==="Slicer"&&p.cal==="Primera";}).reduce(function(s,p){return s+(p.cajas||0)*kgCajaD(p.pres,"Slicer",null,p.org?"org":"conv",d);},0);})},
                {cal:"Selecto",proy:sP(function(d){return(calcD(d).Slicer.org.kgS||0)+(calcD(d).Slicer.conv.kgS||0);}),
                  ped:sP(function(d){return getPedLista(d).filter(function(p){return p.fruta==="Slicer"&&p.cal==="Segunda";}).reduce(function(s,p){return s+(p.cajas||0)*kgCajaD(p.pres,"Slicer",null,p.org?"org":"conv",d);},0);})}
              ]},
              {prod:"Europeo",col:"#5ab88a",items:[
                {cal:"Piezas 1a",proy:sP(function(d){return(calcD(d).Europeo.org.pzP||0)+(calcD(d).Europeo.conv.pzP||0);}),
                  ped:sP(function(d){return getPedLista(d).filter(function(p){return p.fruta==="Europeo"&&p.cal==="Primera";}).reduce(function(s,p){return s+(p.cajas||0)*(PZS_CAJA[p.pres]||0);},0);})}
              ]},
              {prod:"Minibel",col:"#e07070",items:[
                {cal:"Primera",proy:sP(function(d){return(calcD(d).Minibel.org.kP||0)+(calcD(d).Minibel.conv.kP||0);}),
                  ped:sP(function(d){return getPedLista(d).filter(function(p){return p.fruta==="Minibel";}).reduce(function(s,p){return s+(p.cajas||0)*kgCajaD(p.pres,"Minibel",null,p.org?"org":"conv",d);},0);})}
              ]}
            ];
            var thS={padding:"6px 8px",background:"rgba(122,158,42,0.1)",color:"#7a9e2a",fontWeight:700,textAlign:"right",borderBottom:"1px solid rgba(122,158,42,0.2)",fontSize:11};
            return(
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr>
                  <th style={{...thS,textAlign:"left"}}>Producto</th>
                  <th style={{...thS,textAlign:"left"}}>Calidad</th>
                  <th style={thS}>Proyección</th>
                  <th style={thS}>Pedido</th>
                  <th style={{...thS,color:"#4ade80"}}>Excedente</th>
                </tr></thead>
                <tbody>{rows.map(function(r){return r.items.map(function(it,ii){
                  var exc=it.proy-it.ped;
                  return(<tr key={r.prod+it.cal} style={{background:ii%2===0?"transparent":"rgba(255,255,255,0.02)"}}>
                    {ii===0&&<td rowSpan={r.items.length} style={{padding:"6px 8px",color:r.col,fontWeight:800,verticalAlign:"middle"}}>{r.prod}</td>}
                    <td style={{padding:"6px 8px",color:"#aaa",fontSize:10}}>{it.cal}</td>
                    <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700}}>{Math.round(it.proy).toLocaleString()}</td>
                    <td style={{padding:"6px 8px",textAlign:"right",color:"#fbbf24",fontWeight:700}}>{it.ped>0?Math.round(it.ped).toLocaleString():"-"}</td>
                    <td style={{padding:"6px 8px",textAlign:"right",color:exc>=0?"#4ade80":"#ef4444",fontWeight:800}}>{Math.round(exc).toLocaleString()}</td>
                  </tr>);
                });})}</tbody>
              </table>
            );
          })()}
          <div style={{marginTop:14,background:"rgba(122,158,42,0.05)",border:"1px solid rgba(122,158,42,0.15)",borderRadius:8,padding:"8px 12px"}}>
            <div style={{fontSize:9,color:"#5a7a1a",fontWeight:900,letterSpacing:1.5,marginBottom:6}}>FILTRAR PRODUCTO</div>
            <div className="frow">{[["todos","Todos"]].concat(["Persa","Europeo","Slicer","Morron","Minibel"].map(function(p){return[p,p];})).map(function(x){return(<button key={x[0]} className={"fpbtn"+(bfP===x[0]?" on":"")} onClick={function(){setBfP(x[0]);}}>{x[1]}</button>);})}</div>
          </div>
        </div>
      )}
      {tab==="total"&&<div className="body"><div style={{color:"#86c87a",padding:20,fontSize:14}}>Disponible - {DIAS[di]}<div style={{fontSize:11,color:"#4a6a3a",marginTop:8}}>Proximamente</div></div></div>}
    </div>
  );
}
try{
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}catch(err){
  document.getElementById('root').innerHTML='<div style="color:red;padding:20px;font-size:13px;font-family:monospace;white-space:pre-wrap">ERROR REACT:\n'+err.message+'\n\n'+err.stack+'</div>';
}
</script>
<script>
window.addEventListener('error',function(e){var d=document.createElement('div');d.style='position:fixed;bottom:0;left:0;right:0;background:red;color:white;padding:12px;font-size:12px;z-index:9999;font-family:monospace;white-space:pre-wrap';d.textContent='ERROR: '+e.message+'\nLinea: '+e.lineno;document.body.appendChild(d);},true);
</script>
</body>
</html>
